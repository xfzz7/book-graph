<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>《迟到的回声》导读</title>
<style>
:root{--bg:#f7f5f0;--card:#fffdf8;--ink:#23211d;--mut:#77726a;--line:#e2ddd2;--acc:#a8452c;--accbg:#f6e9e3;

@media(prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#242320;--ink:#e9e5dc;--mut:#9c968a;--line:#3a3833;--acc:#e08a6d;--accbg:#3a2a24;
--claim:#e08a6d;--reason:#7fb0d6;--evidence:#9cc07c;--method:#d8b25c;--caveat:#b99acb;--counter:#a0a0a0;--ok:#8fc08f;--warn:#d9a54f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px 0}
.hrow{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;max-width:1080px;margin:0 auto}
h1{font-size:19px;margin:0;font-weight:700}.by{color:var(--mut);font-size:13px}
nav{display:flex;gap:2px;max-width:1080px;margin:8px auto 0;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-size:15px;padding:7px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
nav small{font-size:11px;opacity:.7;margin-left:3px}
#search{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:14px;width:190px}
main{max-width:1080px;margin:0 auto;padding:22px 20px 90px}
section{display:none}section.on{display:block}
h2{font-size:17px;margin:30px 0 10px;padding-left:10px;border-left:3px solid var(--acc)}h2:first-child{margin-top:0}
h2 small,.hint{font-weight:400;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}
.lead{font-size:13px;color:var(--mut);letter-spacing:.06em;margin-bottom:2px}
.thesis{font-size:21px;line-height:1.6;font-weight:650}
.q{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pill{display:inline-block;font-size:12px;line-height:1.5;padding:0 7px;border-radius:9px;border:1px solid currentColor;margin-right:5px;white-space:nowrap;vertical-align:1px}
.k-claim{color:var(--claim)}.k-reason{color:var(--reason)}.k-evidence{color:var(--evidence)}.k-method{color:var(--method)}.k-caveat{color:var(--caveat)}.k-counter{color:var(--counter)}
.pid{display:inline-block;background:var(--acc);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:0 6px;margin-right:6px;line-height:1.6}
.mut{color:var(--mut)}.sm{font-size:13.5px}
.pcard h3{margin:0 0 4px;font-size:16px}.pcard p{margin:4px 0}
.chips span{display:inline-block;font-size:12px;background:var(--accbg);border-radius:8px;padding:0 8px;margin:2px 4px 2px 0}
.chips .none{background:none;border:1px dashed var(--warn);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:12.5px;white-space:nowrap}
td.dots{white-space:nowrap}
.dot{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:10px;font-weight:700;margin-right:2px;background:var(--line);color:transparent}
.dot.on{background:var(--acc);color:#fff}
.pr{font-size:12px;padding:1px 8px;border-radius:9px;white-space:nowrap}
.pr-must{background:var(--acc);color:#fff}.pr-skim{background:var(--accbg);color:var(--acc)}.pr-skip{background:var(--line);color:var(--mut)}
.bar{height:5px;background:var(--line);border-radius:3px;min-width:50px}.bar i{display:block;height:5px;background:var(--mut);border-radius:3px}
a,.lk{color:var(--acc);cursor:pointer;text-decoration:none}.lk:hover{text-decoration:underline}

.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 12px;font-size:13.5px;color:var(--mut)}
.tools button,.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 11px;font:inherit;font-size:13.5px;cursor:pointer}
.tools button.on,.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border:0}
.node{margin:5px 0}
.nrow{display:flex;gap:6px;align-items:flex-start;padding:5px 8px;border-radius:8px;cursor:pointer}
.nrow:hover{background:var(--accbg)}
.tw{flex:none;width:16px;color:var(--mut);font-size:12px;line-height:28px;user-select:none}
.rel{flex:none;font-size:12px;color:var(--mut);line-height:28px;white-space:nowrap}
.ntext{flex:1}.w-core>.nrow .ntext{font-weight:600}.w-detail>.nrow .ntext{color:var(--mut);font-size:14.5px}
.chtag{font-size:12px;color:var(--mut);white-space:nowrap;margin-left:6px}
.node.closed>ul{display:none}
.root>.nrow{background:var(--card);border:1px solid var(--line)}

.two{display:grid;grid-template-columns:230px 1fr;gap:20px}
.side{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;font-size:14px}
.side div{padding:5px 9px;border-radius:8px;cursor:pointer;display:flex;gap:6px;justify-content:space-between}
.side div.on{background:var(--accbg);color:var(--acc);font-weight:600}.side div.skipd{color:var(--mut);cursor:default;font-size:12.5px}
.claim{padding:8px 10px;border-radius:8px;cursor:pointer;margin:2px 0}
.claim:hover{background:var(--accbg)}.claim.w-core{font-weight:600}.claim.w-detail{color:var(--mut);font-size:14.5px}
.loc{font-size:12.5px;color:var(--mut);font-weight:400}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:40;transform:translateX(105%);transition:transform .18s;overflow:auto;padding:18px 20px 60px}
#drawer.on{transform:none}
#drawer .x{position:absolute;right:14px;top:10px;font-size:22px;cursor:pointer;color:var(--mut);border:0;background:none}
#drawer h4{margin:18px 0 4px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.05em}
#drawer .big{font-size:17px;font-weight:600;line-height:1.65;margin:8px 0}
.quote{border-left:3px solid var(--line);padding:2px 10px;color:var(--mut);font-size:14px}
.rl{padding:5px 0;border-bottom:1px dashed var(--line);font-size:14.5px;cursor:pointer}.rl:hover{color:var(--acc)}

.cterm{font-size:16.5px;font-weight:650}
.vs{font-size:14px;margin-top:6px;padding:6px 10px;background:var(--accbg);border-radius:8px}
.notice{font-size:13.5px;background:var(--accbg);border-radius:10px;padding:9px 13px;margin:8px 0 14px}
.qa{cursor:pointer}.qa .ans{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.qa.open .ans{display:block}.qa .try{font-size:13px;color:var(--mut)}

.rate{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}

.prog{font-size:13.5px;color:var(--mut)}
mark{background:#ffe08a;color:#222;border-radius:3px}
footer{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--mut);font-size:12.5px;line-height:1.7}
@media(max-width:760px){.two{grid-template-columns:1fr}.side{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:4px}#search{width:100%;margin:6px 0 0}body{font-size:15.5px}.hidem{display:none}}
@media print{header,#drawer,.tools,.side{display:none}section{display:block!important}.qa .ans{display:block}}
</style>

const D={"meta": {"title": "迟到的回声", "author": "沈既白", "chars": 40269, "generated": "2026-11-13", "stats": {"claims": 135, "links": 185, "concepts": 15, "chapters": 12, "warnings": 0, "quote_pct": 2.77, "audit": {"done": true, "total": 42, "ok": 40, "fixed": 2, "open": 0}}}, "labels": {"kind": {"claim": "主张", "reason": "理由", "evidence": "证据", "method": "方法", "caveat": "限定", "counter": "对手观点"}, "weight": {"core": "主干", "support": "支撑", "detail": "细节"}, "ev": {"study": "对照研究/实验", "data": "统计数据", "case": "案例", "anecdote": "轶事/个人经历", "authority": "引用权威", "analogy": "类比", "reasoning": "推演/思想实验"}, "link": {"supports": "支持", "causes": "导致", "requires": "以…为前提", "refines": "细化/修订", "rebuts": "反驳", "limits": "限定", "applies": "落实"}, "priority": {"must": "精读", "skim": "略读", "skip": "可跳过"}, "crit": {"strength": "扎实之处", "assumption": "隐含假设", "gap": "论证缺口", "objection": "可能的反驳", "scope": "适用边界"}, "level": {"recall": "回忆", "explain": "解释", "apply": "应用", "evaluate": "评判"}}, "book": {"question": "后果要隔数月乃至数十年才显现、又得反复做的决策,人和组织为什么常常学不到东西?怎样才学得到?", "thesis": "对后果天生就慢的决策,学不会的病根不是反馈迟,而是等待期间涌入的消息把当初的理由改写成「早就知道」;加快反馈只会换来近声并荒废远声。解法是当下封存判断、途中设刻度、结果回来时先读原判断再逐条对账。", "abstract": "作者从一桩爆管复盘说起:结果六年后返回,当事人却几乎都记得自己当初反对过,教训无处落脚。他的回答是,延迟之害不在慢,而在「归因漂移」——记忆被等待期里的新消息朝着已知结局改写,本人不觉且更自信;因此决定学习成败的是等待期有多拥挤,而非多长。流行的「短回路」药方对慢事情无效:它实际上是拿很快到手的近声顶替真实结果(远声),近声被追逐后会失灵,而追踪远声的做法同时荒废,二者形成螺旋。出路有两层:沿推理链预设中途刻度,分段把记忆拉回原处;远声到达时先重读锁死的封笺,再逐条核对理由——学习发生在这个对账时刻。这些被收拢为「回声簿」五步。作者承认:动作技能和两周内见分晓的事应当求快;直觉型判断不宜硬写理由;运气主导的决策须攒够样本;一旦与追责挂钩方法即失效;各柱证据强弱悬殊,做法整体尚未受过检验。", "book_type": "叙事与论证混合,后接方法:先用案例和研究立起一套解释(四根柱子),反驳流行的「短回路」主张,再把解释落成一套五步做法。", "pillars": [{"id": "P1", "title": "漂移是改写", "statement": "迟到的反馈教不会人,是因为等待期间关于当初理由的记忆被新消息朝已知结局改写,当事人不自知且更有把握;只要原初理由在结果返回时原样在场,学习就能恢复。", "how": "它把病因从「慢」换成「理由变了」,全书的药方(保存而非加速)由此才成立;去掉它,封存和对账就失去理由。", "claims": ["c03-k1", "c04-k1", "c08-k1", "c08-k2", "c08-k3", "c08-k4"], "depends_on": [], "chapters": ["c02", "c03", "c04", "c05", "c06", "c07", "c08", "c13"], "evidence": {"case": 5, "anecdote": 3, "study": 6, "data": 4}}, {"id": "P2", "title": "要害是拥挤不是漫长", "statement": "一次迟到的反馈能否教会人,取决于等待期里涌入多少与该决策相关的消息(等待期密度),而不取决于等待有多久。", "how": "它把「慢」与「学不会」拆开,说明不缩短等待也可能学到;同时决定了后面刻度该设多密。", "claims": ["c05-k1", "c05-k2"], "depends_on": ["P1"], "chapters": ["c04", "c05", "c07", "c08"], "evidence": {"study": 3, "data": 1, "case": 3}}, {"id": "P3", "title": "近声螺旋", "statement": "对远声天生就慢的事,所谓加快反馈只是用近声顶替远声;依赖近声使远声追踪荒废,荒废又使依赖加深,其间近声因被追逐而失灵却无人察觉。", "how": "它否定了对手的药方:若「快一点」在慢事情上可行,就不必费力保存原初判断;它也说明对账的对象为何必须是远声。", "claims": ["c03-k2", "c06-k2", "c06-k3", "c07-k1", "c07-k2", "c07-k4"], "depends_on": [], "chapters": ["c03", "c06", "c07", "c11", "c13"], "evidence": {"case": 5, "anecdote": 2, "data": 3}}, {"id": "P4", "title": "等待期可以经营", "statement": "在决策当下沿推理链预设中途刻度(届时应看到什么、看不到是哪一环错了),到期先重读再观察,可以分段截住漂移并让远声提前、分批到达;它与近声性质相反。", "how": "它回答「消息堵不住怎么办」:没有它,对账只能等到最后,而那时漂移已走远。", "claims": ["c09-k1", "c09-k2", "c09-k3", "c09-k4"], "depends_on": ["P1", "P2", "P3"], "chapters": ["c05", "c09", "c13"], "evidence": {"case": 5, "anecdote": 1}}, {"id": "P5", "title": "学习在对账时刻", "statement": "学习不发生在结果到达时,而发生在把远声与锁死的、先于结果重读的原初判断逐条比对理由的时刻;没有这一步,结果只是一则消息。", "how": "这是论点的落点:它把前三个解释性论断收成一个可安排的动作,并说明为何是封笺而非普通记录、为何对理由而非结论。", "claims": ["c10-k1", "c10-k2", "c10-k3", "c10-k4"], "depends_on": ["P1", "P3", "P4"], "chapters": ["c08", "c10", "c12", "c13"], "evidence": {"study": 1, "case": 2}}, {"id": "P6", "title": "回声簿五步可行", "statement": "作者把前面的论断落成一套五步做法(封笺、标声、估密、设刻度、对账),只用于后果天生就慢、数量不多且值得投入的决策,并与考核追责隔离;他自己承认这套做法的效果目前只有示范、尚无证明。", "how": "它是论点「出路」一半的可操作形态;每一步各自落实前面一根支柱,所以前面任何一根不成立,相应步骤就失去依据。", "claims": ["c12-k1", "c12-k2", "c12-k6", "c12-k7"], "depends_on": ["P1", "P2", "P3", "P4", "P5"], "chapters": ["c10", "c12"], "evidence": {"case": 1}}], "concepts": [{"term": "远声", "def": "决策真正想知道的那个结果本身发回的消息;何时返回由事情自身的进程决定。", "aka": [], "evolution": "", "vs": [{"term": "近声", "diff": "远声回答决策所问的问题;近声回答的是一个相邻、较易回答的问题。近声通常是真的、也常与远声相关,但可能失灵,而只有远声能揭穿它。"}], "chapters": ["c03"]}, {"term": "近声", "def": "决策后很快能拿到、被认为与真实结果相关的消息,如验收合格率、试吃评分;它本身无错,错在被拿来顶替远声。", "aka": [], "evolution": "", "vs": [{"term": "中途刻度", "diff": "两者都是等待期里得到的消息,甚至可以是同一个数字。区别在于:刻度事先写明届时应看到什么及原因、对应推理链的某一环、只检验理由;近声是事后凑上来的、只在统计上相关、被当作成败的替身。"}], "chapters": ["c03", "c07"]}, {"term": "归因漂移", "def": "等待结果期间,人关于当初决策理由的记忆被陆续到来的新信息改写,朝与当下所知一致的方向移动;本人不察觉,且对改写后的版本更有把握。其轻重由等待期密度决定。", "aka": [], "evolution": "第二章(c04)最初把它定义为记忆随时间模糊、流失,是一幅损耗的图景;第六章(c08)作者依据栖霞实验表四推翻此说,改为「替换」:机制上需要消息作原料而非单靠时间,方向上总朝向已知结局,感受上当事人不自知反而更确信。旧定义描述的现象被另称为记忆褪色。", "vs": [{"term": "记忆褪色", "diff": "褪色是细节随时间丢失:看时间长短、无方向、本人知道自己记不清、查记录即可补救。漂移看密度、有方向、本人不知、光有记录没用因为不会去查。作者认为妨碍学习的是后者。"}], "chapters": ["c04", "c08"]}, {"term": "记忆褪色", "def": "关于当初理由的细节随时间推移而自然丢失的损耗过程;当事人自知,有记录可查就能补救。", "aka": [], "evolution": "", "vs": [], "chapters": ["c08"]}, {"term": "下注的自己 / 回头的自己", "def": "作者的非正式说法:做决定那一刻的人与结果回来时的人;学习是后者拿结果替前者核账。", "aka": ["下注的自己", "回头的自己"], "evolution": "", "vs": [], "chapters": ["c04"]}, {"term": "等待期密度", "def": "从决策到远声返回之间,平均每段单位时间里,新到的、同该决策相关的信息有多少;与一般的忙碌无关。", "aka": [], "evolution": "", "vs": [], "chapters": ["c05"]}, {"term": "短回路", "def": "温特等人的主张:反馈价值随延迟衰减,组织应尽量缩短行动与后果的距离。这是作者的论辩对手;作者只承认它在后果本来就近的场合成立。", "aka": ["短回路学派"], "evolution": "", "vs": [], "chapters": ["c02", "c06"]}, {"term": "近声变哑", "def": "一个近声被当作目标追逐后,与远声的关联减弱的现象,因为人们学会了绕开二者的共同原因去抬高近声。", "aka": [], "evolution": "", "vs": [], "chapters": ["c07"]}, {"term": "近声螺旋", "def": "依赖近声导致远声追踪荒废,荒废又使近声的失灵无人察觉且别无依据、依赖更深——一个越转越深的回路。", "aka": [], "evolution": "", "vs": [], "chapters": ["c06", "c07"]}, {"term": "文档漂移", "def": "归因漂移的组织版本:记录当初依据的文件在结果明朗后被以报奖、规范、补充等名目修改,越改越贴近现状。", "aka": [], "evolution": "", "vs": [], "chapters": ["c08"]}, {"term": "中途刻度", "def": "决策当下沿推理链预设的观察点,事先写明理由成立时届时应见到什么、未见到则是哪一环有误;到期先重读再观察。", "aka": ["刻度"], "evolution": "", "vs": [], "chapters": ["c09"]}, {"term": "封笺", "def": "决策当下由决策者本人写成并锁死的文件,含判断、理由、预期的远声与时间(方法章又加上「何种情况说明我错了」);远声到达前不可改,且必须先于结果被重读。", "aka": [], "evolution": "", "vs": [{"term": "普通记录(纪要、立项书)", "diff": "普通记录可以被修改,也没人会主动去查;封笺不可改,并以规矩保证先读它、后看结果。"}], "chapters": ["c10", "c12"]}, {"term": "对账时刻", "def": "把到达的远声与未经改写的原初判断并排、逐条核对理由的时刻;作者认为学习发生在此时,且它需要事先安排。", "aka": [], "evolution": "", "vs": [], "chapters": ["c10"]}, {"term": "回声债", "def": "组织中远声已返回、却从未与原初判断核对过的决策的积压量。", "aka": [], "evolution": "", "vs": [], "chapters": ["c10"]}, {"term": "回声簿", "def": "作者研究室的五步做法(封笺、标声、估密、设刻度、对账)及每季清点回声债的功课,只用于远声慢、会重复、代价大的决策。", "aka": [], "evolution": "", "vs": [], "chapters": ["c12"]}], "critique": [{"type": "strength", "text": "第一根柱子的地基是全书最硬的:栖霞实验样本上千、原始理由并非为研究而写、干预随机分组,而且结果指标是此后新批贷款的违约率(行为),不是自我报告。表四「朝结局移动」加「记错者更自信」两项,也确实是损耗说解释不了的。", "targets": ["P1", "c08-k3", "c08-k4"]}, {"type": "gap", "text": "栖霞干预组与对照组的差别是「先重读并签认原始理由」对「完全不重读」。它证明重读有用,却没有单独检验「次序」——作者在方法章断言知道结果后再读效果大打折扣,书中没有为此给出数据。把「先读后看」说成全部奥妙,比实验走得远了一步。", "targets": ["c08-k4", "c12-k6", "P5"]}, {"type": "gap", "text": "「密度而非长度」主要靠柏昭南的档案相关(作者承认不能证因果)和栖霞的事后支行比较。后者同样不是随机的:每月通报贷后情况的支行可能在管理方式、客户类型上本就不同。林场对生鲜铺的对照则混入了另一个差别——林场有按期回看的山簿。所以这一论断更稳妥的读法是「相关且有机制解释」,而非已证实。", "targets": ["P2", "c05-k2", "c08-k9", "c05-k4"]}, {"type": "gap", "text": "第三根柱子(中途刻度)没有任何对照或统计,只有三位从业者的案例和作者「未遇反例」的印象。会给自己设刻度的人很可能本来就是格外审慎的人,看不出是刻度让他们看得清,还是看得清的人才设刻度;作者遇到的样本也无从知道如何选出。作者在结语清点硬证据时恰好漏了这一根。", "targets": ["P4", "c09-k9", "c13-k3"]}, {"type": "gap", "text": "近声变哑的直接证据只有麦垛一家:前后两个相关系数来自不同批次的产品,后一个还是事后从会员记录重建的。车以岚的研究证明了仪表盘之后远声追踪消亡、停止追踪者更信近声,但没有证明这些企业的近声真的失灵了。螺旋的「荒废」一半证据较足,「变哑」一半较薄。", "targets": ["c07-k2", "c07-k5", "c07-k6", "P3"]}, {"type": "gap", "text": "作为整体的回声簿五步没有被检验过。最接近的是沅水试行(只含封笺、一个刻度和对账,无对照组,指标由研究者参与判定),作者自己称其为示范而非证明;泷川的新封笺尚未拆封。标声、估密两步完全没有独立证据。", "targets": ["P6", "c10-k7", "c10-k8", "c13-k7"]}, {"type": "assumption", "text": "全书默认决策当下写下的理由就是「真正的」理由,可以作为对账的基准。但作者自己在别处承认,对直觉型判断,写得出来的理由多半不是真正起作用的那些。那么栖霞银行按规定「至少两句话」的批贷理由、或限三条的封笺,有多大程度反映了实际的判断依据,书中没有讨论。", "targets": ["P1", "P5", "c04-k9", "c10-k9"]}, {"type": "assumption", "text": "远声/近声的二分假定一项决策有一个可辨认、结局清楚的「真实结果」。栖霞的贷款(还或不还)满足这一点;但作者列举的提拔干部、定课程等决策,远声本身多因多果、难以界定,此时「对的必须是远声」如何操作,书里没有示范。", "targets": ["c03-k2", "P3", "c12-k3"]}, {"type": "objection", "text": "短回路的辩护者可以回应:作者自己承认近声本身无错,只要保留远声追踪来定期校准即可。照此,双方的实质分歧比书中的修辞要窄——不是「快」有害,而是「只看快的」有害;合理的结论也许是「短回路加校准」而非另起一套。作者划的「两周」界线也自认没有精确依据。", "targets": ["P3", "c07-k10", "c06-k5"]}, {"type": "objection", "text": "作者在结语承认漂移让人安心、封笺是在同这种「慈悲」作对,又在方法章承认一旦可能被追责,人就会把封笺写成辩护词。一个讲理的反对者会问:在多数真实组织里,书面的事前判断很难保证永不被用于评价个人,那么方法成立所需的那个「约定」有多常见?书里只给了一个失败的例子,没有给出如何维持这个约定。", "targets": ["P6", "c12-k7", "c12-k8"]}, {"type": "scope", "text": "综合作者自己的限定,结论的有效范围相当窄:远声两周以上才到、同类决策会再做、代价够大、理由说得出来、运气成分不压倒判断、且封笺不与奖惩挂钩。动作技能和后果本来就快的事,作者明确站在对手一边。把本书读成「反馈越慢越好」或「不要看指标」都是误读。", "targets": ["thesis", "c06-k5", "c10-k9", "c12-k9"]}], "questions": [{"level": "recall", "q": "「反馈的价值随延迟衰减,所以组织的头等大事是缩短回路」——这是作者的主张吗?", "a": "不是。这是温特短回路学派的核心命题,作者用大半章转述它是为了反驳其越界应用。作者只承认它在后果本来就近(动作技能、两周内见分晓的事)时成立。", "claims": ["c06-k1", "c06-k4", "c06-k5"]}, {"level": "recall", "q": "远声和近声各指什么?近声是「假消息」吗?", "a": "远声是决策真正要问的那个结果本身发回的消息;近声是很快到手、被认为与之相关的消息。近声通常是真的,也常与远声相关,问题在于它回答的是另一个较容易的问题,却被拿来顶替远声。", "claims": ["c03-k2", "c07-k10"]}, {"level": "recall", "q": "栖霞实验的干预组比对照组多做了什么?结果差多少?", "a": "干预组在得知每笔贷款结局之前,必须先重读并签字确认自己当年写的批准理由。其后十二个月新批贷款违约率由 5.8% 降到 4.5%(相对约 22%),对照组由 5.9% 到 5.7%(约 3%)。", "claims": ["c08-k4"]}, {"level": "explain", "q": "第六章的归因漂移定义与第二章的定义差在哪里?作者凭什么推翻旧定义?", "a": "旧定义说记忆随时间模糊流失(损耗);新定义说记忆被新消息改写、朝已知结局移动、本人不觉且更自信(替换)。依据是栖霞实验表四:记错的方向高度一致地偏向结局,而且记错者的把握分反而更高——随机的损耗解释不了这两点。", "claims": ["c04-k5", "c08-k1", "c08-k3", "c08-k5"]}, {"level": "explain", "q": "为什么作者说「安静的二十六年比嘈杂的三个月更容易学到东西」?这个说法与新定义有什么关系?", "a": "因为改写需要原料,即等待期里涌入的相关消息;消息越多改写越多,所以起作用的是等待期密度而非长度。林场几乎没有相关消息打岔,生鲜铺三个月里消息不断。新定义为柏昭南发现的相关性提供了机制解释。", "claims": ["c05-k1", "c08-k6", "P2"]}, {"level": "explain", "q": "近声螺旋的两半分别是什么?为什么被远声教训过的组织也不容易醒悟?", "a": "前一半:依赖近声使回访、长期台账等远声追踪在预算和注意力竞争中荒废。后一半:没有远声校准,近声失灵无人知晓,而且它成了唯一依据,于是依赖更深。唯一能戳穿近声的是远声,可它正是被挤掉的那个。", "claims": ["c06-k3", "c07-k3", "c07-k1"]}, {"level": "explain", "q": "作者为什么说第四根柱子(对账时刻)是架在前三根上的「横梁」?", "a": "因为对账的每个要件都来自前文:漂移是改写且不自知,所以需要锁死并先读的封笺而非普通笔记;近声会顶替远声并变哑,所以对的必须是远声;没有中途刻度,对账只能等到最后,那时漂移已走远。", "claims": ["c10-k3", "P5"]}, {"level": "explain", "q": "对账为什么要对理由而不是只对结论?四格里哪一格最危险,为什么?", "a": "结论的对错多半取决于运气。逐条对理由可分出四格,最危险的是「理由错而结果好」:不对账它会被记成成功经验,漂移还会把理由改写成对的,错的理由于是被原样再用——泷川的三条理由在智能水表项目里复活就是如此。", "claims": ["c10-k4", "c10-k5", "c10-k6"]}, {"level": "apply", "q": "一家公司上线新的入职培训,决定每周看「培训满意度评分」,并据此判断培训是否成功。按书中的框架,这个评分是中途刻度还是近声?怎样才能把它变成刻度?", "a": "是近声:它因为出数快而被选中,并被当作成败的替身。要成为刻度,须在决策当下写明「如果培训设计的某条理由成立,届时评分(或别的观察)应是什么样、不符则是哪条理由有问题」,并注明它不作成败依据;同时要指定谁去取远声(如一年后的实际胜任情况)。", "claims": ["c09-k4", "c09-k5", "c12-k3"]}, {"level": "apply", "q": "某投资团队想采用回声簿,并计划把每位成员封笺的「命中率」纳入年终考评以示重视。按作者的说法会发生什么?", "a": "方法会失效且比没有更糟:知道封笺将被用来评判自己,人们会把它写成四平八稳的辩护词,对账时不会有一张落入「理由错」。作者在一家国企的试行正因被纳入追责档案而叫停。此外,投资结果运气成分重,作者要求同类封笺攒到约二十张才下结论。", "claims": ["c12-k7", "c12-k8", "c10-k9"]}, {"level": "apply", "q": "一位资深急诊分诊护士被要求为每次「这个病人不对劲」的判断写下三条理由并封存。作者会赞成吗?", "a": "不会。这属于理由说不出来的直觉型判断,硬写理由会让人转而依赖写得出的理由、撂下更准的直觉。作者主张此类封笺只写结论和预期,对账也只对到结论,四格用不上。", "claims": ["c10-k9", "c02-k5"]}, {"level": "evaluate", "q": "六根支柱(作者自己说的四根柱子)里,哪一根的证据最弱?作者自己是否承认?", "a": "「等待期可以经营」(中途刻度)最弱:只有茶厂、桥梁、育种三个案例和作者「没遇到反例」的见闻,没有对照或数据。作者在结语列举各柱硬证据时没有列它,只说其余的请读者自己掂量。", "claims": ["P4", "c09-k9", "c13-k3"]}, {"level": "evaluate", "q": "「等待期密度造成归因漂移」这一因果判断,书中的证据到了什么程度?", "a": "柏昭南的档案研究只是相关(-0.52),作者承认不能证明因果;补充的旁证是栖霞实验中通报勤的支行偏移更大,但那是事后比较而非随机分组。所以是「相关加上合理机制」,未到实验证实的程度。", "claims": ["c05-k2", "c05-k3", "c08-k9"]}, {"level": "evaluate", "q": "沅水医疗集团的试行(同类错误重犯从 34% 降到 19%)能在多大程度上证明对账有效?", "a": "有限。作者自己指出它没有对照组,试行前后的药品、政策和人员并不相同,何为「同类错误」又是研究者参与判定的、可能受期望影响;他称之为可行性示范而非证明。第四根柱子主要仍靠栖霞干预组。", "claims": ["c10-k7", "c10-k8"]}, {"level": "evaluate", "q": "第九章介绍的山簿、堤簿、三年账,能否作为回声簿有效的证据?", "a": "不能,作者明确声明这些材料一概不作证据:古人这样做过不证明有效,失传的办法可能正因无用。它们只说明相似的做法曾被独立摸索出来。", "claims": ["c11-k2", "c11-k1"]}], "takeaways": ["复盘前先问:我现在记得的「当初的理由」,是当时写下的,还是后来知道结果之后才有的?记得越清楚、越觉得「早就知道」,越该去翻原始记录。", "看任何又快又方便的指标时,先分清它是远声还是近声;若是近声,确认还有人在按期取远声来校准它——没有的话,你无从知道它是否已经失灵。", "对一项会重复、后果要很久才来的重要决策:当下花十五分钟写下判断、至多三条理由、预期结果和「什么情况说明我错了」,封起来;结果回来时先读它,再看结果,逐条对理由。", "结果好的决策也要对账:理由错而结果好的那一类,不查就会被当成经验原样再用。", "采信本书时按证据分层:改写式的归因漂移和「先读后看」有随机实验支撑;密度、螺旋有相关和追踪数据;中途刻度和整套五步目前主要是案例与设想。"], "thesis_claims": ["c02-k1", "c02-k2", "c13-k1"], "aside": [{"claims": ["c11-k1", "c11-k2"], "why": "第九章是作者自称的闲笔,材料一概不作证据"}]}, "chapters": [{"id": "c01", "title": "(开头部分)", "chars": 519, "skip": true, "why": "正文开始前的零散内容(封面/版权/目录)"}, {"id": "c02", "title": "序言 一封六年前的会议纪要", "chars": 1768, "skip": false, "priority": "skim", "why": "序言把结论、四根柱子和边界一次说完,导读已覆盖;值得亲读的是作者关于证据强弱和自己可能偏袒的两段自白。", "role": "作者序言:交代问题来历,提前亮出核心结论、要反驳的流行看法、四根柱子的分布和主张的边界。", "summary": "作者做了十二年项目后评估,因一份与当事人回忆全然不符的旧会议纪要而起疑:结果回来时,当初做决定的那个自己若已被替换,教训落在谁身上?他辞职办研究室,六年间访谈、追踪并做调查。结论先行:学不到东西不因反馈慢,而因等待中决策时的自己被改写;办法是封存当初的判断再对账。全书由四根相互倚靠的柱子支撑,并有明说的边界和强弱不一的证据。", "claims": [{"id": "c02-k1", "kind": "claim", "weight": "core", "text": "在反馈迟到的情境里,人和组织学不到东西的根源不是反馈慢,而是等待期间做决定时的那个自己被不知不觉地改写,结果回来时只遇到一个自认为早就知道的人。", "quote": "自己被悄悄改写了", "ev": "", "pos": 0.4, "pillars": []}, {"id": "c02-k2", "kind": "method", "weight": "core", "text": "出路不是让结果更快返回,而是在决策当时把判断原样封存,待结果返回后拿两者对账。", "quote": "保存等待之前的自己", "ev": "", "pos": 0.4, "pillars": []}, {"id": "c02-k3", "kind": "counter", "weight": "core", "text": "流行的「短回路」看法认为,迟到的反馈之所以教不会人,毛病就出在迟,因此应当缩短周期、加密测量,让反馈快起来。", "quote": "毛病出在“迟”上", "ev": "", "pos": 0.33, "pillars": ["P1"]}, {"id": "c02-k4", "kind": "claim", "weight": "support", "text": "全书结论由四根互相倚靠的柱子支撑:归因漂移、快反馈治不了病反致螺旋、等待期可以经营、学习发生在结果到达之外的另一个时刻;前三根不稳,第四根无处安放。", "quote": "第四根无处可放", "ev": "", "pos": 0.47, "pillars": []}, {"id": "c02-k5", "kind": "caveat", "weight": "support", "text": "作者承认主张有边界:有些事情快反馈确实是好的,短回路学派在那里没说错;有些判断若硬要人写下理由,反而会损害判断本身。", "quote": "反而会把判断弄坏", "ev": "", "pos": 0.67, "pillars": []}, {"id": "c02-k6", "kind": "caveat", "weight": "support", "text": "作者提醒书中证据强弱不一,既有数百上千人的严谨对照研究,也有只是亲见亲闻的故事,而且他作为当事人可能对偏爱的结论把关偏松。", "quote": "喜欢的结论手软", "ev": "", "pos": 0.73, "pillars": []}, {"id": "c02-k7", "kind": "evidence", "weight": "detail", "text": "一家水务公司六年前的技术决策会留有两页纪要,六年后复盘会上每位当事人的回忆都与纪要不符,而作者确信他们并未说谎。", "quote": "一个并不存在的过去", "ev": "anecdote", "pos": 0.13, "pillars": []}, {"id": "c02-k8", "kind": "claim", "weight": "detail", "text": "作者自述第九章讲古人如何与迟到的反馈相处,对论证贡献不大,可以跳过;第十章的「回声簿」五步做法每一步都依赖前文,不能单独拿出来用。", "quote": "对论证的贡献不大", "ev": "", "pos": 0.53, "pillars": []}], "concepts": ["回声", "短回路"], "skipped": []}, {"id": "c03", "title": "第一章 六年后才响的钟", "chars": 3437, "skip": false, "priority": "must", "why": "泷川案例是全书反复回指的样本,远声与近声的定义和全书适用范围也在这里;后面每章都默认你记得这一章。", "role": "用泷川水务案例提出全书问题,定义远声/近声这对基础术语,并划定全书讨论的决策范围。", "summary": "泷川水务 2009 年选用的复合内衬钢管在第六个冬天接连爆裂。复盘会上多数当事人真诚地记得自己当年反对或有保留,纪要却显示几乎全票赞成。作者据此区分快速到来的近声与决策真正要问的远声,指出比技术失误更要紧的是:远声回来时人人自认早就知道,教训无人承接,同样结构的理由两年后再次被采用。最后限定全书只讨论远声迟、等待期不空闲、且会重复的决策。", "claims": [{"id": "c03-k1", "kind": "claim", "weight": "core", "text": "迟到的结果之所以教不会人,要害不在懒惰、健忘或官僚,而在漫长等待使结果与当初原因之间的联系被悄悄改接,教训落不到一个承认自己曾被说服的人身上。", "quote": "可以落脚的人", "ev": "", "pos": 0.73, "pillars": ["P1"]}, {"id": "c03-k2", "kind": "claim", "weight": "core", "text": "决策之后的消息分两种:远声是决策所求的真实结果本身发回的消息,到来时间由事情本身决定;近声是很快拿到、被认为与真实结果相关的消息,它回答的只是一个邻近而较易回答的问题。", "quote": "比较容易回答的问题", "ev": "", "pos": 0.63, "pillars": ["P3"]}, {"id": "c03-k3", "kind": "evidence", "weight": "core", "text": "泷川水务六年后的复盘会上,11 位当年参与选型的人中有 9 位说自己曾反对或有保留,而 2009 年的纪要记录的表决结果却是赞成十票、反对仅一票,而投反对票的那位并未到会。", "quote": "十票赞成", "ev": "case", "pos": 0.13, "pillars": ["P1"]}, {"id": "c03-k4", "kind": "evidence", "weight": "support", "text": "泷川 2009 年铺设的 46 公里复合内衬钢管,到 2015 年入冬后已爆管 31 处;原因是内衬与钢壁热膨胀系数不同,冻融循环使结合面逐次松动,而恒温的加速老化试验和无冻融的南方经验都测不出这一点。", "quote": "试验做的是恒温", "ev": "case", "pos": 0.03, "pillars": ["P3"]}, {"id": "c03-k5", "kind": "evidence", "weight": "support", "text": "铺管之后的近声全是好消息:验收合格率高、压力测试全部通过、第一年漏损率明显下降,工程 2010 年还获省级奖并长期作为样板。", "quote": "对外介绍时的样板", "ev": "case", "pos": 0.4, "pillars": ["P3"]}, {"id": "c03-k6", "kind": "evidence", "weight": "support", "text": "唯一投反对票的工程师骆敬山承认自己当年也拿不出证据,只是认为此事当时无人能知;验收当天看到管子状况良好,连他也怀疑自己多虑。", "quote": "兴许是我多虑了", "ev": "anecdote", "pos": 0.5, "pillars": ["P3"]}, {"id": "c03-k7", "kind": "evidence", "weight": "support", "text": "复盘后公司的正式结论只是加强新材料准入、增设一道审批;两年后它又以厂家加速试验报告、外地两城在用、安装周期短这三条同样骨架的理由选用了新型智能水表,签字者中有两位正是自称当年反对过的人。", "quote": "只是换了名词", "ev": "case", "pos": 0.77, "pillars": ["P1"]}, {"id": "c03-k8", "kind": "reason", "weight": "support", "text": "一个自认早就知道的人没有可学之处:在他的记忆里他并未相信那些理由,因此不会去追问当初为何觉得它们充分。", "quote": "没有什么可学的", "ev": "", "pos": 0.73, "pillars": ["P1"]}, {"id": "c03-k9", "kind": "caveat", "weight": "support", "text": "全书只讨论同时满足三个条件的决策:远声要数月乃至数十年才返回;等待期间决策者继续工作并接收消息;同类决策以后还要再做。几秒几分钟见分晓的技能不在范围内。", "quote": "不在本书的范围之内", "ev": "", "pos": 0.9, "pillars": ["P1"]}, {"id": "c03-k10", "kind": "claim", "weight": "detail", "text": "近声并非假消息,通常真实且确与远声相关;泷川案例技术层面的失败只是近声好而远声坏,这类新技术长期风险估计不足的事例很常见,并非本书关注的重点。", "quote": "不值得写一本书", "ev": "", "pos": 0.67, "pillars": ["P3"]}, {"id": "c03-k11", "kind": "evidence", "weight": "detail", "text": "当年的管网部副主任看到纪要上自己的赞成签名后说,他不是忘了,而是记得太清楚,所以从未想过去翻纪要。", "quote": "没想过要去翻", "ev": "anecdote", "pos": 0.97, "pillars": ["P1"]}, {"id": "c03-k12", "kind": "evidence", "weight": "detail", "text": "更换那 46 公里管线的费用是当初选便宜管材所省金额的四倍多。", "quote": "省下来的钱的四倍多", "ev": "data", "pos": 0.73, "pillars": ["P3"]}], "concepts": ["远声", "近声"], "skipped": []}, {"id": "c04", "title": "第二章 等待期里发生了什么", "chars": 3602, "skip": false, "priority": "skim", "why": "注意这一章给归因漂移下的定义是作者后来推翻的旧版,不要带着它读下去;栖霞实验前半部分和「药方不同」的推论看导读即可。", "role": "给出证据说明泷川并非特例,提出归因漂移的初版(损耗式)定义,并推出第一根柱子的雏形:延迟之害在等待期里理由变了,而非慢。", "summary": "作者重读旧报告、访谈 87 位管理者,发现当事人对决策理由的回忆与书面材料大面积不符;栖霞实验的前半部分则以上千名信贷审核员的数据显示,一年半后回忆与原始记录的一致率不足一半。作者据此提出归因漂移的初版定义——记忆随时间模糊流失——并预告它将在第六章被推翻。即便如此,它已足以推出:从结果中学习预设当初的理由仍在原处,延迟的害处在于这个前提失效,因此存在「等待照旧、但让理由不变」的另一种药方。", "claims": [{"id": "c04-k1", "kind": "claim", "weight": "core", "text": "迟到的反馈难以教会人,主要原因不是晚到,而是它尚未到来时,它要去检验的对象——决策当时的理由——就已经变了。", "quote": "等待期里出了事", "ev": "", "pos": 0.78, "pillars": ["P1"]}, {"id": "c04-k2", "kind": "reason", "weight": "core", "text": "「从结果中学习」的通行模型暗含一个未经检查的前提:结果回来时当初的理由仍原样可查;反馈迟到后这个前提不再可靠,复盘检查的只是此刻脑中关于当初理由的一个版本。", "quote": "不相干的东西挑毛病", "ev": "", "pos": 0.69, "pillars": ["P1"]}, {"id": "c04-k3", "kind": "claim", "weight": "core", "text": "「慢」与「等待期里理由变了」的区别在于药方:前者只能靠缩短等待,而这在许多领域做不到;后者允许等待照旧而设法保持理由不变,原则上任何领域都可能适用。", "quote": "设法让理由不变", "ev": "", "pos": 0.84, "pillars": ["P1"]}, {"id": "c04-k4", "kind": "evidence", "weight": "core", "text": "栖霞实验(郦望舒,2011–2014 年,23 家农村合作银行、1146 名信贷审核员)的前半部分显示:贷款结局明朗的十八个月后,审核员对自己当初批贷主要理由的回忆,与系统里原始记录的一致率平均只有 41%。", "quote": "只有百分之四十一", "ev": "study", "pos": 0.34, "pillars": ["P1", "P2"]}, {"id": "c04-k5", "kind": "claim", "weight": "support", "text": "作者在本章给归因漂移下的初版定义是:等待结果期间,人对当初决策理由的记忆渐渐模糊流失,以致结果到来时无法把它与当初的理由准确对应;这是一幅「损耗」的图景。", "quote": "关于损耗的图景", "ev": "", "pos": 0.56, "pillars": ["P1", "P2"]}, {"id": "c04-k6", "kind": "caveat", "weight": "support", "text": "作者预先声明损耗式的初版定义并不准确:它描述的现象真实存在却不要紧,漏掉了真正要紧的那一种,第六章将把它推翻重写。", "quote": "真实存在但并不要紧", "ev": "", "pos": 0.62, "pillars": ["P1", "P2"]}, {"id": "c04-k7", "kind": "evidence", "weight": "support", "text": "迟响研究室 2017–2019 年访谈 87 位各行业管理者,先请其回忆一两年前某项决策的理由再出示书面材料;主要理由能与材料大体对上的受访者不足三成。", "quote": "不到三成", "ev": "data", "pos": 0.09, "pillars": ["P1"]}, {"id": "c04-k8", "kind": "caveat", "weight": "support", "text": "作者承认 87 人访谈不是严格研究:受访者靠关系找来,材料由对方自愿提供,「基本吻合」由研究者商量判定,因此它只能说明泷川不是特例。", "quote": "不能说明更多", "ev": "", "pos": 0.28, "pillars": ["P1"]}, {"id": "c04-k9", "kind": "reason", "weight": "support", "text": "栖霞实验之所以可信,在于信贷审核同时具备三个条件:约十八个月的天然延迟、结局清楚(还款或违约)、以及审核员批贷时按规定写下且并非为研究而写的原始理由。", "quote": "这些理由是干净的", "ev": "", "pos": 0.38, "pillars": ["P1", "P2"]}, {"id": "c04-k10", "kind": "evidence", "weight": "detail", "text": "一位医院院长回忆两年前引进检验设备的首要理由是看准了区域检验中心政策,而当年论证报告的核心理由是旧设备故障多、维修合同到期,那项政策在设备买回一年后才出台。", "quote": "维修合同到期", "ev": "anecdote", "pos": 0.12, "pillars": ["P1"]}, {"id": "c04-k11", "kind": "evidence", "weight": "detail", "text": "一位职业学校校长坦言记不全三年前砍掉某专业的理由,并主动去查当年的报告;作者当时把他与那位院长归为同一类,后来认为这个归类是错的。", "quote": "残缺得很老实", "ev": "anecdote", "pos": 0.22, "pillars": ["P1"]}, {"id": "c04-k12", "kind": "evidence", "weight": "support", "text": "受访机构几乎都存有纪要、报告或邮件,但在研究者出示材料之前,主动提出先查一下的受访者极少。", "quote": "没有人觉得用得着它", "ev": "data", "pos": 0.25, "pillars": ["P1"]}, {"id": "c04-k13", "kind": "evidence", "weight": "support", "text": "栖霞实验论文的一个脚注指出:审核员的回忆与原始记录不一致时,极少有人说记不清,他们给出的是完整、具体、确凿的理由,只是并非当初所写;作者称这是整个问题的钥匙。", "quote": "言之凿凿的理由", "ev": "study", "pos": 0.94, "pillars": ["P1", "P2"]}], "concepts": ["归因漂移", "下注的自己 / 回头的自己"], "skipped": []}, {"id": "c05", "title": "第三章 林场与生鲜铺", "chars": 3677, "skip": false, "priority": "skim", "why": "「密度而非长度」的结论简单,林场与生鲜铺的对照看导读即可;但柏昭南研究只是相关性的那一段(作者自己的限定)建议读原文。", "role": "回答「等待长短是不是要害」:以林场与生鲜铺的对照和柏昭南的档案研究,立起「等待期密度」概念——起作用的是拥挤而非漫长。", "summary": "轮伐期二十六年的栎溪林场靠山簿把每一步决策的理由、观察日期和所见接续起来,场主并不觉得当年的想法陌生;而朝圃生鲜的定价团队只等了三个月,却在复盘会上说不清当初为何提高配送门槛。柏昭南对两千多项资本支出决策的统计显示,延迟长度与复盘准确度几乎无关,等待期间涌入的相关事件数量才与之明显负相关。作者据此提出等待期密度,并说明这只是相关性证据。", "claims": [{"id": "c05-k1", "kind": "claim", "weight": "core", "text": "一次迟到的反馈能否教会人,取决于等待期密度的高低而不是延迟的长短;安静的二十六年比嘈杂的三个月更容易让人学到东西。", "quote": "安安静静的二十六年", "ev": "", "pos": 0.53, "pillars": ["P1", "P2"]}, {"id": "c05-k2", "kind": "evidence", "weight": "core", "text": "柏昭南团队 2016 年发表的档案研究,整理了 412 家制造企业的 2317 项资本支出决策(延迟从 4 个月到 9 年):延迟长度与复盘准确度的相关系数仅 -0.08,而等待期内每月平摊的相关事件数与复盘准确度的相关系数为 -0.52。", "quote": "负的零点五二", "ev": "data", "pos": 0.37, "pillars": ["P1", "P2"]}, {"id": "c05-k3", "kind": "caveat", "weight": "support", "text": "柏昭南的研究是档案统计而非实验,无法随机分组,只能证明密度与复盘变差相伴而不能证明因果,可能有管理混乱之类的共同原因;控制企业规模、行业和项目金额后结果仍在,但柏昭南本人没有把话说满,作者自认比他大胆。", "quote": "两者相伴", "ev": "", "pos": 0.63, "pillars": ["P1", "P2"]}, {"id": "c05-k4", "kind": "evidence", "weight": "support", "text": "栎溪林场三代人用「山簿」逐坡记下种什么、为何这样种、预备哪年来看和看什么;场主闻人樾能带着因果讲清每面坡的教训,并说隔二十多年回看当年想法不觉陌生,因为中间没有别的事打岔。", "quote": "没有别的东西来打岔", "ev": "case", "pos": 0.1, "pillars": ["P1", "P2", "P4"]}, {"id": "c05-k5", "kind": "evidence", "weight": "detail", "text": "闻人樾 1996 年听技术员建议在杉木中混种一成檫木,山簿上写明十年后比较杉木长势;2006 年他在同一页记下混种无效,此后不再混种——整个过程中没有人声称早就知道檫木不行。", "quote": "肥地之说不验", "ev": "case", "pos": 0.23, "pillars": ["P1", "P2", "P4"]}, {"id": "c05-k6", "kind": "evidence", "weight": "support", "text": "朝圃生鲜定价团队 2019 年把会员免配送费门槛由 68 元提到 88 元,书面方案写了两条理由并约定三个月后看续费率;三个月里竞争对手开店、换副总、大促、两份口径不一的专题分析接连涌来,复盘会上众人对当初目的各执一词,那页方案始终没人打开。", "quote": "没有人想起去打开它", "ev": "case", "pos": 0.7, "pillars": ["P1", "P2"]}, {"id": "c05-k7", "kind": "reason", "weight": "support", "text": "一面杉木坡的等待期密度近乎为零,二十六年里相关新消息只是七八次上山所见;泷川那批管子的六年里则不断有得奖、参观、年报、渗漏报告、厂家解释等消息往当事人脑中添东西。", "quote": "隔的东西却很少", "ev": "", "pos": 0.57, "pillars": ["P1", "P2"]}, {"id": "c05-k8", "kind": "caveat", "weight": "support", "text": "等待期密度高不等于忙或杂事多:只有与该项决策有关的消息才算数,六年里做的一百个无关项目不计入。", "quote": "或者“杂事多”", "ev": "", "pos": 0.6, "pillars": ["P1", "P2"]}, {"id": "c05-k9", "kind": "counter", "weight": "support", "text": "通行的看法认为,反馈周期长达二十六年、一辈子只得到一两次反馈的林业是学不到东西的行当;按第二章的损耗说法,等得越久理由流失越多,林场主也应比泷川的工程师更糊涂。", "quote": "简直是算命", "ev": "", "pos": 0.07, "pillars": ["P1", "P2", "P4"]}, {"id": "c05-k10", "kind": "caveat", "weight": "detail", "text": "相关消息究竟怎样「掺进」关于决策的记忆,作者在本章承认还说不清,留待第六章回答。", "quote": "是拥挤,不是漫长", "ev": "", "pos": 0.6, "pillars": ["P1", "P2"]}], "concepts": ["等待期密度", "复盘准确度", "山簿"], "skipped": []}, {"id": "c06", "title": "第四章 快一点,再快一点", "chars": 3703, "skip": false, "priority": "skim", "why": "前大半是对短回路学派的转述,不是作者主张;重点读后半:作者承认对手在哪里是对的、越界之后「缩短」变成了什么、以及两种不适用批评的情形。", "role": "完整陈述对手「短回路学派」的主张与论据,承认其在本来地盘上成立,再指出它被搬到慢事情上时实为以近声顶替远声,并使远声追踪荒废(螺旋的前一半)。", "summary": "作者先以大半篇幅介绍温特《短回路》和岑牧野《七日法则》:反馈价值随延迟衰减,所以要缩短回路,并有技能学习规律、软件团队调查和射手比喻为据。作者承认在后果本来就近、只是被流程拖长的场合,这是对的。但对后果本身就慢的事情,所谓缩短只是把目光移向近声,等于换了靶子;更严重的是,近声一旦方便,回访、长期台账等追踪远声的做法就在预算和注意力竞争中被废弃。章末划出短回路完全成立的两种情形。", "claims": [{"id": "c06-k1", "kind": "counter", "weight": "core", "text": "短回路学派(温特)的核心命题是:反馈的价值随延迟衰减,拖到一定长度后只能记分而不能当教练,所以想学习的组织首要任务是尽量缩短行动与后果之间的距离。", "quote": "价值随延迟而衰减", "ev": "", "pos": 0.11, "pillars": ["P1", "P3"]}, {"id": "c06-k2", "kind": "claim", "weight": "core", "text": "对后果本身就要很久才发生的事情,远声无法缩短,所谓缩短回路实际只是把目光移到近声上——不是更早看见同一个靶子,而是换了一个较近、大致同向的靶子。", "quote": "缩短的是近声", "ev": "", "pos": 0.59, "pillars": ["P3"]}, {"id": "c06-k3", "kind": "claim", "weight": "core", "text": "对近声的依赖会使对远声的追踪荒废,依赖越深荒废越甚:近声又快又多又方便之后,回访、长期台账、多年一次的专项评估显得又慢又贵,在预算和注意力的竞争中落败。", "quote": "后者越废", "ev": "", "pos": 0.78, "pillars": ["P3"]}, {"id": "c06-k4", "kind": "claim", "weight": "core", "text": "作者认为短回路学派在其本来的地盘上是对的:在总装线、后厨、代码测试这类场合,真实后果本来就近,只是被流程人为拖长,缩短回路等于把被扣押的远声放出来。", "quote": "被流程扣押的远声", "ev": "", "pos": 0.44, "pillars": ["P3"]}, {"id": "c06-k5", "kind": "caveat", "weight": "support", "text": "作者划定两种批评不适用、短回路完全成立的情形:动作技能型学习(投篮、弹琴、缝合等);以及远声本身两周内就到达的事情。「两周」只是研究室的经验界线,并无精确依据。", "quote": "没有什么精确的依据", "ev": "", "pos": 0.89, "pillars": ["P3"]}, {"id": "c06-k6", "kind": "counter", "weight": "support", "text": "温特为缩短回路提出三方面论据:后果跟得越紧联结越牢的学习机制;对 78 个软件团队的追踪显示回路长度减半的团队有效迭代产出升至 2.4 倍;以及即时看靶与一周后才收到环数的两个射手的思想实验。", "quote": "原来的二点四倍", "ev": "", "pos": 0.19, "pillars": ["P1", "P3"]}, {"id": "c06-k7", "kind": "counter", "weight": "support", "text": "岑牧野《七日法则》主张:任何决策都必须在七天内配上一个看得见的信号,配不上就拆成更小的决策,仍拆不开的属于「不可学习」,应尽量少做;他以禾灶快餐把月报拆成每个饭点的小票、一年内平均出餐时间从 11 分钟降到 6 分钟为例。", "quote": "七天之内听不到回声", "ev": "", "pos": 0.3, "pillars": ["P1", "P3"]}, {"id": "c06-k8", "kind": "claim", "weight": "support", "text": "「把决策拆小」对慢事情行不通:管材寿命无法拆分,实际发生的总是人们找到一个七日内看得见的东西,然后宣布它就是信号。", "quote": "七分之一个冬天", "ev": "", "pos": 0.63, "pillars": []}, {"id": "c06-k9", "kind": "evidence", "weight": "support", "text": "作者 2012 年起在衡川推行周复盘,几年后发现每周过目的进度、预算、阶段验收等指标,没有一项是项目真正要的结果(如污水厂此后二十年出水稳定达标)。", "quote": "项目真正要的东西", "ev": "anecdote", "pos": 0.41, "pillars": ["P3"]}, {"id": "c06-k10", "kind": "evidence", "weight": "support", "text": "一家市政设计院原有项目交付满三年回访的老规矩;周复盘推行两年后,有人以每周都在复盘为由质疑其必要,回访无人下令便悄然停止,负责的老工程师退休后岗位未补。", "quote": "三年回访还有必要吗", "ev": "case", "pos": 0.74, "pillars": ["P3"]}, {"id": "c06-k11", "kind": "claim", "weight": "support", "text": "单是换靶子并不太坏,因为近声与远声大致同向,看近声胜过什么都不看;这种「近声不等于远声」的提醒温特自己也说过。真正要命的是有了近声之后没人再等远声。", "quote": "再也没有人等远声了", "ev": "", "pos": 0.67, "pillars": ["P3"]}, {"id": "c06-k12", "kind": "claim", "weight": "detail", "text": "作者认为短回路学派有一个少被提起却深刻的论点:迟迟得不到反馈的人会不再在乎结果,短回路让人重新感到自己的努力与世界相连,这关乎士气和尊严而不只是效率。", "quote": "也是尊严问题", "ev": "", "pos": 0.37, "pillars": ["P3"]}, {"id": "c06-k13", "kind": "claim", "weight": "detail", "text": "仅靠「依赖近声使远声追踪荒废」不足以解释现实:被迟到的远声教训过的组织并未醒悟,反而更深地陷入近声,说明还有另一半机制把它们往回推。", "quote": "在把它们往回推", "ev": "", "pos": 0.96, "pillars": ["P3"]}], "concepts": ["短回路", "回路长度", "七日法则"], "skipped": []}, {"id": "c07", "title": "第五章 近声螺旋", "chars": 3470, "skip": false, "priority": "must", "why": "第二根柱子在此合拢:近声变哑与螺旋的两半如何咬合需要跟着麦垛案例一步步看;末尾还说明作者并不反对看近声。", "role": "补上螺旋的后一半并立起第二根柱子:近声被追逐会变哑,远声荒废又使人更信近声,二者互相加剧成「近声螺旋」;同时说明近声本身无错。", "summary": "麦垛烘焙用三天试吃评分取代十二个月复购来决定新品去留:十二个月的册子无人再记,研发则冲着评分把产品做得更甜更软,评分与复购的相关性大幅下滑而无人知晓。作者由此提出近声变哑,并指出远声追踪荒废会经由「失效无人知晓」和「别无依据」两条路加深对近声的依赖,与上一章合成近声螺旋。车以岚对 56 家连锁零售企业的追踪提供了系统证据。作者强调问题不在看近声,而在让近声冒充远声。", "claims": [{"id": "c07-k1", "kind": "claim", "weight": "core", "text": "近声螺旋:对近声的依赖使远声追踪荒废,远声追踪的荒废反过来加深对近声的依赖,两者互相加剧,每转一圈都陷得更深。", "quote": "都往下沉一层", "ev": "", "pos": 0.5, "pillars": ["P3"]}, {"id": "c07-k2", "kind": "claim", "weight": "core", "text": "近声变哑:某个近声被当成目标来追逐之后,它与远声的关联就会减弱,因为人们找到了绕开两者共同原因(东西确实好)也能抬高近声的办法。", "quote": "原因就被绕开了", "ev": "", "pos": 0.39, "pillars": ["P3"]}, {"id": "c07-k3", "kind": "reason", "weight": "core", "text": "远声追踪荒废通过两条路加深对近声的依赖:没有远声校准,近声失效无人知晓、看上去始终可信;没有远声可用,近声成了唯一信息来源,不可信也只能信。", "quote": "不可信也只能信", "ev": "", "pos": 0.46, "pillars": ["P3"]}, {"id": "c07-k4", "kind": "claim", "weight": "core", "text": "第二根柱子的完整表述:凡远声天生就慢的事,反馈其实快不起来,所谓加快只是以近声替换远声;这种替换会启动近声螺旋;螺旋中近声变哑而组织失去察觉能力——所以短回路用在慢事情上不但无效,还让组织失去知觉。", "quote": "让病人失去知觉", "ev": "", "pos": 0.75, "pillars": ["P3"]}, {"id": "c07-k5", "kind": "evidence", "weight": "core", "text": "麦垛烘焙 2015 年起以试吃评分决定新品去留,当时评分与十二个月复购的相关系数为 0.61;研发转而追逐评分,平均分从 3.9 升到 4.4,而研究室 2019 年回溯发现 2016 年后上架新品的这一相关系数只剩 0.14。", "quote": "只剩零点一四", "ev": "case", "pos": 0.14, "pillars": ["P3"]}, {"id": "c07-k6", "kind": "evidence", "weight": "core", "text": "车以岚 2018 年发表的对 56 家连锁零售企业的追踪显示:引入日度经营仪表盘之前,71% 的企业定期追踪需十二个月以上才见分晓的结果指标,三年后只剩 37%;多数停止追踪的企业说不出是谁在何时决定停止的。", "quote": "只剩百分之三十七", "ev": "data", "pos": 0.61, "pillars": ["P3"]}, {"id": "c07-k7", "kind": "evidence", "weight": "support", "text": "车以岚还发现,请管理者按 1–7 分评价「日度指标能在多大程度上预示长期结果」时,已停止追踪远声的企业打出的分数明显更高,高过那些仍在追踪的企业。", "quote": "没有办法检验的人", "ev": "data", "pos": 0.71, "pillars": ["P3"]}, {"id": "c07-k8", "kind": "evidence", "weight": "support", "text": "麦垛改用试吃评分后,店长手记的十二个月复购册子无人催交:第一年还有一半门店在记,第二年只剩几家,第三年换系统后彻底消失,没有人做过取消它的决定。", "quote": "只是不再被需要了", "ev": "case", "pos": 0.21, "pillars": ["P3"]}, {"id": "c07-k10", "kind": "caveat", "weight": "support", "text": "作者不赞成「近声害人、以后不看」的结论:近声本身没有错,错在让它顶替远声并因此荒废等待;只要仍在老实追踪远声,就可以放心看近声,因为远声会定期告诉你哪些近声还灵。", "quote": "近声冒充远声", "ev": "", "pos": 0.82, "pillars": ["P3"]}, {"id": "c07-k11", "kind": "caveat", "weight": "detail", "text": "作者承认麦垛只是一个步骤清楚的故事,单凭它不能说明普遍性,因此才引入车以岚的系统追踪。", "quote": "不能说明普遍性", "ev": "", "pos": 0.57, "pillars": ["P3"]}, {"id": "c07-k12", "kind": "claim", "weight": "support", "text": "近声螺旋只解释组织为何停止等待远声,解释不了泷川那种远声自己找上门却仍学不到的情形;可见光让远声回得来还不够,还须有一个它认得的人在等它。", "quote": "它认得的人在等它", "ev": "", "pos": 0.89, "pillars": ["P3"]}, {"id": "c07-k13", "kind": "claim", "weight": "support", "text": "等待期里涌入的消息有相当大一部分正是近声:近声不仅挤掉远声,还日复一日流进等待者的头脑——这把近声螺旋与等待期密度连了起来。", "quote": "一部分正是近声", "ev": "", "pos": 0.96, "pillars": ["P1", "P2"]}], "concepts": ["近声变哑", "近声螺旋"], "skipped": []}, {"id": "c08", "title": "第六章 不是遗忘,是改写", "chars": 3484, "skip": false, "priority": "must", "why": "全书的转折和最硬的证据都在这里:归因漂移被重新定义,栖霞实验的表四和随机干预是第一根柱子的地基,值得亲自核对数字和实验设计。", "role": "推翻第二章的损耗式定义,把归因漂移重新定义为有方向、不自知、越改越自信的「改写」,并用栖霞实验后半部分立稳第一根柱子、预告出路。", "summary": "栖霞实验的表四显示,审核员记错的理由并非杂乱,而是整齐地朝贷款结局移动,且记错者比记对者更有把握。作者据此承认旧定义把性质说错了:要紧的不是流失而是替换。新定义下,改写以等待期涌入的消息为原料,这解释了密度为何比长度重要;作者并把它与无害的记忆褪色区分开,指出组织文件同样会漂移。实验的随机干预——得知结局前先重读并签认原始理由——使后续违约率明显下降,说明只要原初理由原样在场,学习即可恢复。", "claims": [{"id": "c08-k1", "kind": "claim", "weight": "core", "text": "修订后的归因漂移:等待结果期间,关于当初决策理由的记忆被陆续到来的新信息改写,朝与当下所知相符的方向移动;当事人察觉不到,而且对改写后的版本比对原本更有把握。", "quote": "相一致的方向移动", "ev": "", "pos": 0.44, "pillars": ["P1"]}, {"id": "c08-k2", "kind": "claim", "weight": "core", "text": "第一根柱子的完整表述:迟到的反馈难以教会人,病根是归因漂移而不是迟;只要结果返回时原初的理由能不走样地摆在面前,人就重新学得到东西。作者称这是四根柱子里他最放心的一根,因为有随机对照实验支撑。", "quote": "我最放心的一根", "ev": "", "pos": 0.97, "pillars": ["P1"]}, {"id": "c08-k3", "kind": "evidence", "weight": "core", "text": "栖霞实验表四:对后来违约的贷款,63% 的审核员回忆自己当初就有疑虑,而原始批准理由中带疑虑字样的只占 17%;对正常还款的贷款,回忆的理由比原始记录更笃定——记忆整齐地朝结局方向移动。", "quote": "只占百分之十七", "ev": "study", "pos": 0.21, "pillars": ["P1"]}, {"id": "c08-k4", "kind": "evidence", "weight": "core", "text": "栖霞实验把 1146 名审核员随机分组:干预组 574 人须在得知每笔贷款结局前重读并签认自己当年的批准理由,其后十二个月新批贷款违约率从 5.8% 降至 4.5%(相对降约 22%);对照组 572 人从 5.9% 降至 5.7%(相对降约 3%)。", "quote": "先看自己,后看结果", "ev": "study", "pos": 0.88, "pillars": ["P1", "P5"]}, {"id": "c08-k5", "kind": "evidence", "weight": "support", "text": "栖霞实验表四还显示:回忆与原始记录不一致的审核员给自己回忆打的把握分平均 7.9,高于回忆一致者的 6.4——记错的人更确信。", "quote": "比记对的人更确信", "ev": "study", "pos": 0.29, "pillars": ["P1"]}, {"id": "c08-k6", "kind": "reason", "weight": "support", "text": "改写与流失的机制不同:流失只需时间,改写却需要原料,即等待期涌入的消息;消息越多改写越多,所以起作用的是等待期密度而非延迟长短。", "quote": "改写却需要原料", "ev": "", "pos": 0.5, "pillars": ["P1", "P2"]}, {"id": "c08-k7", "kind": "reason", "weight": "support", "text": "改写有方向,总是朝向现在已知的事,使过去的自己显得更有先见之明、过去与现在之间没有落差;而「原以为如此、结果不然」的落差正是学习的全部原料。", "quote": "学习的全部原料", "ev": "", "pos": 0.53, "pillars": ["P1"]}, {"id": "c08-k8", "kind": "claim", "weight": "support", "text": "须把记忆褪色与归因漂移分开:褪色由时间长短决定、无方向、当事人自知且把握下降、有记录可查即可补救;漂移由等待期密度决定、有方向、不自知且把握上升、光有记录不够。两者常同时发生,但对学习而言褪色无关大局,漂移才是祸首。", "quote": "漂移才是祸首", "ev": "", "pos": 0.62, "pillars": ["P1"]}, {"id": "c08-k9", "kind": "evidence", "weight": "support", "text": "栖霞实验的事后比较:所在支行每月通报贷后情况、因而在等待的一年半里不断听到相关企业消息的审核员,回忆朝结局移动的幅度明显大于批完后再无下文的审核员;作者以此作为「高密度造成差复盘」的旁证。", "quote": "改写越重", "ev": "study", "pos": 0.71, "pillars": ["P1", "P2"]}, {"id": "c08-k10", "kind": "evidence", "weight": "support", "text": "研究室抽查一家设计院 340 份立项书的修改记录,发现其中 28% 说明项目缘由和依据的那一节,在结果已明朗之后被改动过,名目是报奖、归档规范或后任补充;作者称之为文档漂移,把它看作组织版的归因漂移。", "quote": "没有人觉得这是篡改", "ev": "data", "pos": 0.76, "pillars": ["P1"]}, {"id": "c08-k11", "kind": "claim", "weight": "support", "text": "既然漂移是改写而非遗忘,仅仅做好记录不够:记录必须改不动,并且要赶在结果揭晓前让当事人亲眼重读;又因为改写靠等待期的消息喂养,等待期本身也不能放任不管。", "quote": "记录必须是改不动的", "ev": "", "pos": 1.0, "pillars": []}, {"id": "c08-k12", "kind": "claim", "weight": "detail", "text": "被改写的人与只是记忆流失的人感受不同:后者知道自己丢了东西会去翻记录,前者的记忆完整具体,因此绝不会想到要查——泷川的纪要和朝圃的方案不是找不到,而是无人觉得需要找。", "quote": "比真货还像真货", "ev": "", "pos": 0.56, "pillars": ["P1"]}], "concepts": ["归因漂移", "记忆褪色", "文档漂移"], "skipped": []}, {"id": "c09", "title": "第七章 给等待刻上刻度", "chars": 3570, "skip": false, "priority": "must", "why": "第三根柱子只有案例和见闻支撑,作者在结语也没把它列入有硬证据的名单——需要你自己读三个案例来判断信不信;刻度与近声的三条区别也易混。", "role": "立第三根柱子:等待期可以经营。以三位从业者的做法提炼出「中途刻度」,并说明它与近声性质相反。", "summary": "茶厂厂长陶砚秋、桥梁总工戚怀远、育种家贺松年都在决策当下写明:若自己的道理成立,若干年后各应看到什么,看不到则是推理的哪一环出错;到期先重读再观察。作者称之为中途刻度:它把漫长拥挤的等待切成几段,每到一处把记忆拨回原处,并让远声提前、分批到达。它与近声的区别在于事先约定、是推理链的一环、用来检验理由而不冒充结果。等待期越拥挤,刻度应越密。作者的依据是这些案例和「未遇反例」的见闻。", "claims": [{"id": "c09-k1", "kind": "claim", "weight": "core", "text": "第三根柱子:等待的那段时间并非只能空等,而是可以经营的;顺着推理链预先设好中途刻度,就能在远声到来之前分段拦住漂移,并使远声提前、分批到达。", "quote": "一段一段地截住", "ev": "", "pos": 0.9, "pillars": ["P4"]}, {"id": "c09-k2", "kind": "method", "weight": "core", "text": "中途刻度的做法:决策当下沿着支撑决策的推理链预设若干观察点,每个点事先写明「若我的理由成立,届时应看到什么」以及「若没看到,是哪一环出了问题」;到期先重读当初所写,再去看实情。", "quote": "哪一环出了问题", "ev": "", "pos": 0.26, "pillars": ["P4"]}, {"id": "c09-k3", "kind": "reason", "weight": "core", "text": "中途刻度起两个作用:每到一个刻度先重读原话,等于让记忆归位一回,漂移未及走远就被拉回;同时让远声不必等到最后才开口,而且开口时点明的是推理链中出问题的那个具体环节。", "quote": "把记忆拨回原处一次", "ev": "", "pos": 0.65, "pillars": ["P4"]}, {"id": "c09-k4", "kind": "claim", "weight": "core", "text": "中途刻度与近声性质相反,区别有三:刻度在决策当下预先约定,近声是事后哪里有数就看哪里;刻度是决策理由本身的一环,近声只在统计上与结果相关;刻度用来检验理由、从不冒充结果,近声被拿来顶替结果。", "quote": "它从不冒充结果", "ev": "", "pos": 0.74, "pillars": ["P4"]}, {"id": "c09-k5", "kind": "method", "weight": "support", "text": "区分刻度与近声的试金石:该消息到来之前,是否有人事先写下它应当是什么样子及其原因;有则为刻度,无则为近声,同一个数字可以两者皆是。", "quote": "可以二者皆是", "ev": "", "pos": 0.84, "pillars": []}, {"id": "c09-k6", "kind": "evidence", "weight": "support", "text": "岩帕茶厂厂长陶砚秋在压饼当天写下拼配理由,并写明一年、三年、五年开仓时茶各应是什么状态、不符则是哪一环有误;到期先读纸再品茶并续记。她能指着一批畅销茶说其实配错了,卖得好只是赶上行情。", "quote": "赶上了行情", "ev": "case", "pos": 0.16, "pillars": ["P4"]}, {"id": "c09-k7", "kind": "evidence", "weight": "support", "text": "棠阴路桥设计院总工戚怀远要求每座大桥随图纸交「预言书」,预言通车第一、三、十年关键位置的挠度等数值范围及其所依据的设计假定;一座桥第三年挠度略超范围,追查发现当地骨料徐变偏大,此后该地区设计都改了取值。", "quote": "徐变系数要另取", "ev": "case", "pos": 0.42, "pillars": ["P4"]}, {"id": "c09-k8", "kind": "evidence", "weight": "detail", "text": "育种家贺松年为每个杂交组合写明选亲本的理由和期望性状,并约定第三年看苗期抗病、第七年看果形、第九年看贮藏及相应的判断标准,到期先读本子再下地。", "quote": "替它约好哪天说", "ev": "case", "pos": 0.55, "pillars": ["P4"]}, {"id": "c09-k9", "kind": "evidence", "weight": "support", "text": "作者对第三根柱子的信心来自见闻:岩帕、棠阴、贺松年以及后来遇到的几位设了刻度的人,回看多年前的决定都清楚而不自辩;他说至今没有遇到一个反例。", "quote": "没有遇到过一个反例", "ev": "anecdote", "pos": 0.94, "pillars": ["P4"]}, {"id": "c09-k10", "kind": "claim", "weight": "support", "text": "刻度的疏密应随等待期密度而定:等待期越拥挤,改写走得越快,刻度就该越密;安静的林场二十六年里看七八回即可。", "quote": "刻度就应当越密", "ev": "", "pos": 0.97, "pillars": ["P4"]}, {"id": "c09-k11", "kind": "claim", "weight": "detail", "text": "近声会启动螺旋而刻度不会:刻度自设立之时就声明它不过是半路上的一个站点,它的存在本身提醒人终点未到。", "quote": "提醒人终点还没到", "ev": "", "pos": 0.87, "pillars": ["P4"]}, {"id": "c09-k12", "kind": "counter", "weight": "support", "text": "读者可能质疑:一年开仓尝茶、第三年测挠度不就是前两章批评的近声吗?不过是把近声换个名字请了回来。", "quote": "这不就是近声吗", "ev": "", "pos": 0.68, "pillars": ["P4"]}], "concepts": ["中途刻度", "预言书"], "skipped": []}, {"id": "c10", "title": "第八章 对账时刻", "chars": 3611, "skip": false, "priority": "must", "why": "全书落点:对账时刻、封笺、四格对法都在此;沅水试行的证据分量和两种不成立的情形,决定你对结论打多少折扣。", "role": "立第四根柱子也是全书落点:学习发生在「对账时刻」而非结果到达之时;说明它如何架在前三根柱子上,给出封笺与四格对法,并交代证据分量与两种不适用情形。", "summary": "作者指出,结果到达并不自动带来学习;学习发生在把结果与未经改写的原初判断逐条比对的时刻。对账需要一份决策当下写成、不可改且先于结果重读的封笺;对的必须是远声;中途刻度则是途中的小对账。有用的对账对的是理由而非结论,由此分出四格,其中「理由错而结果好」最危险。沅水医疗集团的试行显示同类错误重犯减少,但作者承认它没有对照组,只算示范。对说不出理由的直觉判断和运气主导的决策,这套做法要打折扣。", "claims": [{"id": "c10-k1", "kind": "claim", "weight": "core", "text": "学习不发生在结果到达的那一刻,而发生在「对账时刻」:把结果与未经改写的原初判断并排、逐条比对之时。不经对账,结果即使到了也不过是一条消息,算不上反馈。", "quote": "只是一则消息", "ev": "", "pos": 0.1, "pillars": ["P5"]}, {"id": "c10-k2", "kind": "method", "weight": "core", "text": "封笺:决策当下把判断、理由、预期结果和预期时间写下并封存,远声到来前不得改动。它区别于普通记录之处有二:不可改;必须定成规矩先于结果被重读——先开封笺,后看结果。", "quote": "先开封笺", "ev": "", "pos": 0.19, "pillars": ["P5"]}, {"id": "c10-k3", "kind": "claim", "weight": "core", "text": "第四根柱子不是独立的,而是搭在前三根之上的横梁:不懂漂移的实质是改写,就不明白为何需要封笺而非普通笔记;没有近声螺旋就不知对账对象为何必须是远声;没有中途刻度,对账只能等到最后,那时漂移已走得太远。", "quote": "前三根上面的横梁", "ev": "", "pos": 0.32, "pillars": ["P5"]}, {"id": "c10-k4", "kind": "method", "weight": "core", "text": "有用的对账对的是理由而非结论:逐条查看每条理由所预期的事是否发生,结果落入四格之一——理由对结果对(可照做)、理由对结果坏(多半是运气,别改)、理由错结果好(最危险)、理由错结果坏(标准教训)。", "quote": "这是最危险的一格", "ev": "", "pos": 0.42, "pillars": ["P5"]}, {"id": "c10-k5", "kind": "reason", "weight": "support", "text": "「理由错而结果好」一格对迟到的反馈格外要紧:没有封笺时,凡结果好的决策都会自动被当成理由也对,因为漂移会把理由改写成对的;泷川的三条理由就是在获奖时被记成成功经验,后来才在智能水表立项中复活。", "quote": "把理由改写成对的", "ev": "", "pos": 0.58, "pillars": ["P5"]}, {"id": "c10-k6", "kind": "reason", "weight": "support", "text": "只对结论几乎无用,因为结论对不对很大程度上取决于运气:泷川的管子若铺在不结冰的城市,结论就是对的,而三条理由的毛病一条不少。", "quote": "很大程度上是运气", "ev": "", "pos": 0.39, "pillars": ["P5"]}, {"id": "c10-k7", "kind": "evidence", "weight": "core", "text": "沅水医疗集团药事委员会 2019–2021 年对 164 项新药引进决策试行封笺与对账(六个月设刻度、十八个月对账):被认定不当的引进中「同类错误重犯」的比例从试行前的 34% 降到试行期末的 19%。", "quote": "降到了百分之十九", "ev": "case", "pos": 0.65, "pillars": ["P5"]}, {"id": "c10-k8", "kind": "caveat", "weight": "support", "text": "作者承认沅水试行没有对照组,前后两期的药品、政策、人员都变了,「同类错误」的认定也可能受期望影响,所以它只是可行性示范而非证明;第四根柱子的证明主要靠栖霞实验干预组加前三根柱子的合力。", "quote": "而不是证明", "ev": "", "pos": 0.71, "pillars": ["P5"]}, {"id": "c10-k9", "kind": "caveat", "weight": "support", "text": "对账有两种不成立的情形:理由说不出来的直觉判断(如急诊分诊、品茶),硬写理由会使人弃用更准的直觉,封笺只应写结论和预期;运气成分远大于判断的决策,单次对账无意义,同类封笺要攒到约二十张才值得当真。", "quote": "攒到二十张左右", "ev": "", "pos": 0.94, "pillars": ["P5", "P6"]}, {"id": "c10-k10", "kind": "claim", "weight": "support", "text": "回声债指组织中远声已到、却始终没拿去和当初的判断核对的决策积压了多少;欠得越多,组织越是凭从未检验的理由行事却自认阅历深厚,资历深的人和历史长的机构往往欠得最重。", "quote": "自以为经验丰富", "ev": "", "pos": 0.77, "pillars": ["P5"]}, {"id": "c10-k11", "kind": "counter", "weight": "support", "text": "育种家裴南乔的说法:经验是事先说过会发生的事与后来真发生的事之间的差,差得越多学得越多。作者赞同前半(没有事先说过的话就没有经验),但不同意「差得越多学得越多」,也不同意把事先说过当作经验的唯一来源。", "quote": "学得越多", "ev": "", "pos": 0.81, "pillars": ["P5"]}, {"id": "c10-k12", "kind": "claim", "weight": "support", "text": "要紧的不是预期与结果差得多大,而是差落在推理链的哪一环:落在要害假定上的小差比说不清来由的大差有用;此外有些重要发现是无人预先说过的意外,封笺管不到,不应因此视而不见。", "quote": "推理链的哪一环上", "ev": "", "pos": 0.87, "pillars": ["P5"]}, {"id": "c10-k13", "kind": "counter", "weight": "support", "text": "通常的想法(「吃一堑,长一智」)认为,结果一出来学习就自动发生:消息到达,人受触动,于是长了见识。", "quote": "堑一吃,智就长", "ev": "", "pos": 0.0, "pillars": ["P5"]}], "concepts": ["对账时刻", "封笺", "回声债", "同类错误重犯"], "skipped": []}, {"id": "c11", "title": "第九章 山簿、堤簿与三年账", "chars": 3574, "skip": false, "priority": "skip", "why": "作者自己声明是闲笔、材料不作证据、不读不影响使用方法;对旧账簿有兴趣再看。唯一有论证意味的是末尾关于这些做法为何式微的三点印象。", "role": "作者自称的闲笔:以山簿、堤簿、三年账等旧做法说明封笺、不可改、刻度、对账并非新发明,并解释它们为何式微;明言这些材料不作证据。", "summary": "作者介绍几种互不相干的旧时做法:林农的山簿预留空白页约定回看次数,低地国家的堤簿记下每段堤可挡多高的水并在每次大潮后回填,盐号的三年账由东家画押、三年后当众念出再议,观象台的候簿封存推断岁末对看。它们共有三点:当下写明道理、不改只添、约期回看先念旧话。作者认为这些做法式微缘于载体可随意改动、专业评估把对账从决断者手中拿走、近声太方便。他强调古人这样做并不证明有效。", "claims": [{"id": "c11-k1", "kind": "claim", "weight": "core", "text": "山簿、堤簿、三年账行当地域各异、彼此无往来,却有三点共同之处:决断当下就写明道理而非事后追记;写下的不改,后话只能添在旁边;预先约定回看的日子,届时先念旧话再议新事——作者认为这正是本书所说封笺、不可改动、中途刻度与对账的旧时形态。", "quote": "先念旧话", "ev": "", "pos": 0.75, "pillars": []}, {"id": "c11-k2", "kind": "caveat", "weight": "core", "text": "作者声明本章对论证没有新增内容,材料一概不作证据:古人这样做过不能证明有效,失传的办法也可能正因无用才失传;它带来的只是感情上的踏实。", "quote": "不拿来当证据用", "ev": "", "pos": 0.0, "pillars": []}, {"id": "c11-k3", "kind": "claim", "weight": "support", "text": "这些旧做法后来少见,作者凭印象给出三个原因:载体从订死的册子变为可随意编辑且不留痕的电子文档,「不可改」悄然丢失;专业评估制度兴起,把对账从决断者手里交给不在场的外人却没做成;近声变得太方便,等待不再必要。", "quote": "却没能把它做成", "ev": "", "pos": 0.83, "pillars": ["P3"]}, {"id": "c11-k4", "kind": "evidence", "weight": "support", "text": "恒裕盐号在年账之外设「三年账」:每项要紧决断写明缘由并由东家或掌柜画押,平日不许翻动,满三年后账房当众逐条念出并问如今如何,把议论结果写在原条之下;选三年是因为此时事已见分晓而经手人尚在。", "quote": "此事如今如何", "ev": "case", "pos": 0.58, "pillars": []}, {"id": "c11-k5", "kind": "evidence", "weight": "support", "text": "据作者同事转述,某北方低地国家的堤簿要求每次动工后记下修法依据和这段堤估计能扛多高的潮位,此后每逢大潮无论堤垮否都回到该页记下实际潮位与堤况——堤没垮也被当作一次检验。", "quote": "可当何等之水", "ev": "case", "pos": 0.38, "pillars": []}, {"id": "c11-k6", "kind": "evidence", "weight": "detail", "text": "栎溪一带林农的山簿(又称青册、树账)栽树当天预留空白页,留几页即预备来看几回,有的在页眉预写年份和要看的项目;因毛笔纸册难以无痕涂改,簿中涂改极少而后人旁注很多。", "quote": "就是预备来看几回", "ev": "case", "pos": 0.17, "pillars": []}, {"id": "c11-k7", "kind": "evidence", "weight": "detail", "text": "据转抄的片段,汶阳观象台的「候簿」每年立春前后写下对当年旱涝寒暖的推断及所据并封存,岁末与日簿逐条对看,批验或不验;有批语称某条依据连年不验可废——对的是理由而非结论。作者说看不出这是否让推断更准。", "quote": "连岁不验,可废", "ev": "anecdote", "pos": 0.71, "pillars": []}, {"id": "c11-k8", "kind": "caveat", "weight": "support", "text": "作者承认旧办法有局限:山簿管不了有几千项决策的公司;三年账依赖东家与账房之间的信任,放进人人担心被追责的机构,多半会变成没人敢说真话的册子。", "quote": "没人敢说真话的册子", "ev": "", "pos": 0.96, "pillars": []}, {"id": "c11-k9", "kind": "claim", "weight": "detail", "text": "作者称下一章的五个步骤没有一步是新发明,只是把旧做法用今天的话重说,再补上两件古人不必操心的事:怎样保证写下的文字无法被改动,以及怎样避免被近声牵着走。", "quote": "没有哪一步是新发明", "ev": "", "pos": 1.0, "pillars": []}], "concepts": ["三年账", "堤簿"], "skipped": []}, {"id": "c12", "title": "第十章 回声簿", "chars": 3656, "skip": false, "priority": "must", "why": "打算照做就必须读:五步各自的硬性要求(当下写、锁死、限三条、先读后看)和不得与追责挂钩等失效条件,细节比导读能容纳的多。只想理解论证可略读。", "role": "方法章:把前文概念落成「回声簿」五步(先封笺,再标声、估密,然后设刻度,最后对账),逐步注明来历,并交代适用范围和会使它失灵的条件。", "summary": "回声簿只用于远声两周以上才到、会重复、值得花工夫的决策。五步依次是:当下写下并锁死封笺(判断、至多三条理由、预期远声及时间、何种情况说明自己错了);把今后可能收到的消息标为远声或近声并指定谁去取远声;把等待期密度估成稀中密三档;沿理由设两三个刻度;远声到时先读封笺签字、再看结果、逐条对理由归入四格并写一句下次的不同做法。另需每季清点回声债。它不能与考核追责挂钩,不能代写,集体决策应各写一张。", "claims": [{"id": "c12-k1", "kind": "method", "weight": "core", "text": "回声簿共五步,依次为封笺、标声、估密,再设刻度,最后对账;次序不能乱,每一步都依赖前文的一个概念,作者警告不知来历照做容易走样。", "quote": "标声、估密、设刻度", "ev": "", "pos": 0.0, "pillars": ["P6"]}, {"id": "c12-k2", "kind": "method", "weight": "core", "text": "第一步封笺:决策当下由决策者本人写下判断、至多三条理由、预期的远声及大约到达时间、还有哪些情况一旦出现即表明自己错了;两条硬性要求是当下就写、写完即锁(连本人也不得改动,新想法另纸附后)。按作者的经验,写一张用不了十五分钟。", "quote": "就说明自己错了", "ev": "", "pos": 0.09, "pillars": ["P6"]}, {"id": "c12-k3", "kind": "method", "weight": "support", "text": "第二步标声:封笺写完后列出此后可能收到的各种消息,逐个标明是远声还是近声,近声注明仅供参考、不作成败依据;同时写明远声由谁、用什么办法去取。", "quote": "不作成败之据", "ev": "", "pos": 0.27, "pillars": ["P6"]}, {"id": "c12-k4", "kind": "method", "weight": "support", "text": "第三步估密:估计从现在到远声回来之间相关消息来得多勤,分稀、中、密三档即可;对密的决策,除加密刻度外还要规定凡开会讨论此事,会前先念一遍封笺。", "quote": "会前先把封笺念一遍", "ev": "", "pos": 0.39, "pillars": ["P6"]}, {"id": "c12-k5", "kind": "method", "weight": "support", "text": "第四步设刻度:沿封笺上的理由预设两到三个刻度,各写明何时看、理由成立应看到什么、没看到是哪条理由有问题;日期写定后不改,逾期未看须留记录;检验一个刻度真伪的办法是问它验的是第几条理由。", "quote": "封笺上的第几条理由", "ev": "", "pos": 0.52, "pillars": ["P6"]}, {"id": "c12-k6", "kind": "method", "weight": "core", "text": "第五步对账须按固定次序:先开封笺重读并签字确认,再看远声(最好由另一人掌管结果);然后逐条对理由并归入四格,对「理由错而结果好」格外郑重记录;最后只写一句下次遇到同样结构的决策会有何不同,写不出就写「无」。", "quote": "替当初的自己找补", "ev": "", "pos": 0.7, "pillars": ["P6"]}, {"id": "c12-k7", "kind": "caveat", "weight": "core", "text": "回声簿绝不能与绩效考核、奖惩或追责挂钩,否则比没有更糟:写的人知道封笺会被用来评判自己,写下的就成了预备好的辩护词。作者明言,凡封笺可能被拿去追究个人责任的地方,这套方法都不适用。", "quote": "预先准备好的辩护词", "ev": "", "pos": 0.88, "pillars": ["P5", "P6"]}, {"id": "c12-k8", "kind": "evidence", "weight": "support", "text": "研究室在一家国有企业试行时,集团监察部门提出要把封笺归入终身追责的决策档案;此后所有封笺都写得又长又圆滑,对账时没有一张落入「理由错」的格子,试行被研究室主动叫停。", "quote": "变得又长又圆", "ev": "case", "pos": 0.88, "pillars": ["P5", "P6"]}, {"id": "c12-k9", "kind": "caveat", "weight": "support", "text": "回声簿的适用对象须同时符合三条:远声两周以上才到;同类决策还会再做;做错的代价值得花这份工夫。这样的决策在多数机构一年不过几十件。", "quote": "一年不过几十件", "ev": "", "pos": 0.03, "pillars": ["P6"]}, {"id": "c12-k10", "kind": "reason", "weight": "support", "text": "理由限三条是试行中磨出来的:不设限时人们写七八条面面俱到,将来无论结果如何总有几条对,无法对账;限三条等于逼人回答自己到底凭什么下的决心。", "quote": "凭什么下的这个决心", "ev": "", "pos": 0.15, "pillars": ["P6"]}, {"id": "c12-k11", "kind": "method", "weight": "support", "text": "封笺不得由秘书或下属代写,因为代写记下的是代写者理解的理由;集体决策应每人各写一张而非合写一张,合写的是妥协产物,而各写常能发现众人赞成同一方案的理由互不相干甚至矛盾。", "quote": "妥协的产物", "ev": "", "pos": 0.94, "pillars": ["P6"]}, {"id": "c12-k12", "kind": "method", "weight": "detail", "text": "五步之外的定期功课:每季度清点一次回声债,查看哪些封笺的远声已到而未对账、哪些刻度逾期未看,其数目本身就是一个指标。", "quote": "清点一次回声债", "ev": "", "pos": 0.82, "pillars": []}, {"id": "c12-k13", "kind": "method", "weight": "detail", "text": "作者建议读者从一件事开始:挑一项大约半年到一年后才见远声的决策,花十五分钟写一张封笺并封存,在日历上标好两个刻度日和一个对账日,不必说服任何人或建立制度。", "quote": "不必说服任何人", "ev": "", "pos": 1.0, "pillars": ["P6"]}], "concepts": ["回声簿", "标声", "估密"], "skipped": []}, {"id": "c13", "title": "结语 做一个记得自己的人", "chars": 1691, "skip": false, "priority": "skim", "why": "对全书的重述导读已覆盖;值得读的是两处:作者对各柱证据结实程度的最后交代,以及「漂移也许是一种慈悲」对主张范围的收窄。", "role": "结语:重述反对什么、主张什么,说明四根柱子如何相互依赖、证据强弱不一,并补充一条对归因漂移的另一面看法以收窄主张范围。", "summary": "作者回访泷川水务,新管线的选型决策都附了封口的封笺,但他承认这什么也证明不了,做法自身的远声还未返回。他重述全书:流行想法在动作技能和两周内见分晓的事上是对的,越界则错且有害;自己的主张是封存判断、待远声对账。四根柱子依次倚靠,结实程度不一,第三根没有被列入有硬证据的名单。最后他指出归因漂移也许是让人安心度日的本领,因此只主张在会重复、后果由许多人承担的决断上与之作对。", "claims": [{"id": "c13-k1", "kind": "claim", "weight": "core", "text": "作者总括全书主张:在后果本身要经年累月才发生的事情上,学不到东西的根源不是慢,而是等待期间决策时的自己被改写;出路不是缩短等待,而是封存决定当时的判断,待远声回来时拿它对账。", "quote": "拿它对账", "ev": "", "pos": 0.43, "pillars": []}, {"id": "c13-k2", "kind": "claim", "weight": "core", "text": "四根柱子并非并列:第二根要借助第一章区分远声与近声的那对概念;第三根依赖第一根和等待期密度;第四根架在前三根之上,缺一不稳;第一根自身也要到第六章才站直。", "quote": "不是并排站着的", "ev": "", "pos": 0.57, "pillars": ["P5"]}, {"id": "c13-k3", "kind": "caveat", "weight": "core", "text": "作者提醒四根柱子结实程度不同:第一根有栖霞实验;第二根靠车以岚的追踪研究与麦垛一案;第四根靠栖霞的干预组,外加沅水一个硬度有限的前后比较;其余的请读者自己掂量——第三根(中途刻度)未被列入。", "quote": "请读者自己掂量", "ev": "", "pos": 0.64, "pillars": ["P4", "P5"]}, {"id": "c13-k4", "kind": "counter", "weight": "support", "text": "本书反对的流行想法是:迟到的反馈之所以教不会人,毛病在迟,因此解决之道就是设法让它变快。", "quote": "所以办法是让它快", "ev": "", "pos": 0.36, "pillars": ["P3"]}, {"id": "c13-k5", "kind": "claim", "weight": "support", "text": "作者认为「让反馈快起来」在动作技能和后果本来两周内见分晓的事情上是对的;一旦用到后果本身就需多年才发生的事情上,它就错了,而且有害。", "quote": "而且错得有害", "ev": "", "pos": 0.36, "pillars": ["P3"]}, {"id": "c13-k6", "kind": "caveat", "weight": "support", "text": "作者补充:归因漂移也许是人赖以过活的本领——把过去的自己改得与现在一致,使人觉得自己始终如一。因此他不主张事事写封笺,只主张在还要再做、做错了由许多人承担后果的决断上与这种「慈悲」作对。", "quote": "承担后果的决断", "ev": "", "pos": 0.79, "pillars": ["P1"]}, {"id": "c13-k7", "kind": "caveat", "weight": "support", "text": "作者承认回声簿做法本身尚未被检验:泷川新管线的封笺要多年后才拆,届时管不管用还得看;同事还指出书中有一处他的信心与证据不相称,他自己没能找出来。", "quote": "远声也还在路上", "ev": "", "pos": 0.21, "pillars": []}, {"id": "c13-k8", "kind": "evidence", "weight": "detail", "text": "泷川水务换管后,每个选型决策都附一页手写签名、封在牛皮纸信封里的纸,信封上写着三年后和八年后两个日期;当年的副主任(现任总工)说自己也记不清写了什么,所以才要封起来。", "quote": "所以才要封起来", "ev": "anecdote", "pos": 0.0, "pillars": []}], "concepts": [], "skipped": []}, {"id": "c14", "title": "致谢", "chars": 507, "skip": true, "why": "标题像版权/目录/致谢/索引等非正文"}], "links": [{"from": "c02-k1", "to": "c02-k3", "type": "rebuts", "note": ""}, {"from": "c02-k2", "to": "c02-k1", "type": "applies", "note": ""}, {"from": "c02-k4", "to": "c02-k1", "type": "supports", "note": ""}, {"from": "c02-k5", "to": "c02-k1", "type": "limits", "note": ""}, {"from": "c02-k6", "to": "c02-k4", "type": "limits", "note": ""}, {"from": "c02-k7", "to": "c02-k1", "type": "supports", "note": ""}, {"from": "c02-k8", "to": "c02-k4", "type": "refines", "note": ""}, {"from": "c03-k3", "to": "c03-k1", "type": "supports", "note": ""}, {"from": "c03-k8", "to": "c03-k1", "type": "supports", "note": ""}, {"from": "c03-k7", "to": "c03-k1", "type": "supports", "note": ""}, {"from": "c03-k4", "to": "c03-k2", "type": "supports", "note": "远声(管子实际寿命)为坏"}, {"from": "c03-k5", "to": "c03-k2", "type": "supports", "note": "近声为好"}, {"from": "c03-k6", "to": "c03-k5", "type": "refines", "note": "近声好消息的力量连反对者也动摇"}, {"from": "c03-k9", "to": "c03-k1", "type": "limits", "note": ""}, {"from": "c03-k10", "to": "c03-k2", "type": "refines", "note": ""}, {"from": "c03-k11", "to": "c03-k3", "type": "refines", "note": ""}, {"from": "c03-k12", "to": "c03-k4", "type": "refines", "note": ""}, {"from": "c03-k1", "to": "c02-k1", "type": "refines", "note": "用案例具体化序言的结论"}, {"from": "c04-k2", "to": "c04-k1", "type": "supports", "note": ""}, {"from": "c04-k4", "to": "c04-k1", "type": "supports", "note": ""}, {"from": "c04-k3", "to": "c04-k1", "ty const chShort=id=>{const t=CHM[id]?.title||id;return t.length>14?t.slice(0,13)+'…':t};
const kindPill=c=>`<span class="pill k-${c.kind}">${esc(L.kind[c.kind]||c.kind)}${c.ev?' · '+esc(L.ev[c.ev]||c.ev):''}</span>`;
const store={get(k,d){try{return JSON.parse(localStorage.getItem('bg:'+D.meta.title+':'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('bg:'+D.meta.title+':'+k,JSON.stringify(v))}catch(e){}}};

// 关系:对每个节点,"下级"是支撑/解释它的东西
const kids={},ups={};
const REL_DOWN={supports:'支持它',causes:'原因',refines:'细化',limits:'限定它',applies:'做法',requires:'前提',rebuts:'反驳了'};
const REL_UP={supports:'支持',causes:'导致',refines:'细化了',limits:'限定了',applies:'落实',requires:'是其前提',rebuts:'被其反驳'};
D.links.forEach(l=>{
  const [parent,child]=(l.type==='requires'||l.type==='rebuts')?[l.from,l.to]:[l.to,l.from];
  (kids[parent]=kids[parent]||[]).push({id:child,type:l.type,note:l.note});
  (ups[child]=ups[child]||[]).push({id:parent,type:l.type,note:l.note});
});

// ---------- 论证树 ----------
let treeDepth=store.get('depth','core');
function nodeHTML(id,rel,seen,depth){
  const c=C[id];if(!c)return'';
  const again=seen.has(id);const s2=new Set(seen);s2.add(id);
  let ks=again?[]:(kids[id]||[]);
  if(treeDepth==='core')ks=ks.filter(k=>C[k.id]&&C[k.id].weight!=='detail');
  const order={claim:0,reason:1,method:2,evidence:3,caveat:4,counter:5};
  ks=[...ks].sort((a,b)=>(order[C[a.id]?.kind]??9)-(order[C[b.id]?.kind]??9));
  const closed=depth>=(treeDepth==='all'?9:1)&&ks.length;
  return `<li class="node w-${c.weight} ${closed?'closed':''}" data-id="${id}"><div class="nrow"><span class="tw">${ks.length?(closed?'▸':'▾'):''}</span>${rel?`<span class="rel">${rel}</span>`:''}
  <span class="ntext">${kindPill(c)}${esc(c.text)}<span class="chtag">${esc(chShort(c.ch))}${again?' · 上文已出现':''}</span></span></div>
  ${ks.length?`<ul>${ks.map(k=>nodeHTML(k.id,REL_DOWN[k.type],s2,depth+1)).join('')}</ul>`:''}</li>`;
}
function desc(id,seen=new Set()){(kids[id]||[]).forEach(k=>{if(!seen.has(k.id)){seen.add(k.id);desc(k.id,seen)}});return seen}
function topClaims(p){const out=[];p.claims.forEach(id=>{if(!out.some(o=>desc(o).has(id)))out.push(id)});return out.filter(id=>!out.some(o=>o!==id&&desc(o).has(id)))}
function renderArgument(){
  const inPillar=new Set(Object.values(C).filter(c=>c.pillars.length).map(c=>c.id));
  const tc=B.thesis_claims||[],asideIds=new Set((B.aside||[]).flatMap(a=>a.claims));
  const loose=Object.values(C).filter(c=>c.weight==='core'&&c.kind!=='counter'&&!c.pillars.length&&!tc.includes(c.id)&&!asideIds.has(c.id));
  const pil=B.pillars.map(p=>`<li class="node root" data-pillar="${p.id}" id="pil-${p.id}"><div class="nrow"><span class="tw">▾</span><span class="ntext"><span class="pid">${p.id}</span><b>${esc(p.title)}</b>:${esc(p.statement)}
    ${p.depends_on.length?`<span class="chtag">以 ${p.depends_on.join('、')} 为前提</span>`:''}</span></div>
    <ul>${topClaims(p).map(id=>nodeHTML(id,'',new Set(),0)).join('')}</ul></li>`).join('');
  $('#s-argument').innerHTML=`
  <div class="card"><div class="lead">核心论点</div><div class="thesis" style="font-size:19px">${esc(B.thesis)}</div>
  ${tc.length?`<div class="sm mut" style="margin-top:10px">作者自己在书中这样表述(点开看出处):</div>${tc.map(id=>C[id]?`<div class="claim" data-claim="${id}">${kindPill(C[id])}${esc(C[id].text)} <span class="chtag">${esc(chShort(C[id].ch))}</span></div>`:'').join('')}`:''}</div>
  <div class="tools">展开到 <span class="seg"><button data-d="pillar">支柱</button><button data-d="core">主干+支撑</button><button data-d="all">全部细节</button></span>
  <span class="hint">每个支柱下面是撑起它的各章主干;再往下是各主干的理由、证据、限定和被反驳的对手观点。点任意一条看出处与关联。</span></div>
  <div class="tree"><ul>${pil}</ul></div>
  ${loose.length?`<h2>没有归入支柱的主干 <small>各章里重要、但不直接承担全书论证的内容</small></h2><div class="tree"><ul>${loose.map(c=>nodeHTML(c.id,'',new Set(),1)).join('')}</ul></div>`:''}
  ${(B.aside||[]).filter(a=>a.claims.length).map(a=>`<h2>论证之外 <small>${esc(a.why)}</small></h2><div class="tree"><ul>${a.claims.map(id=>nodeHTML(id,'',new Set(),1)).join('')}</ul></div>`).join('')}
  <p class="sm mut" style="margin-top:18px">图例:${Object.keys(L.kind).map(k=>`<span class="pill k-${k}">${L.kind[k]}</span>`).join('')} 其中「对手观点」是作者引述并<b>反对</b>的说法,不是作者的主张。</p>`;
  $$('#s-argument .seg button').forEach(b=>{b.classList.toggle('on',b.dataset.d===treeDepth);b.onclick=()=>{treeDepth=b.dataset.d;store.set('depth',treeDepth);renderArgument()}});
  if(treeDepth==='pillar')$$('#s-argument .root').forEach(n=>{n.classList.add('closed');$('.tw',n).textContent='▸'});
}
document.addEventListener('click',e=>{
  const tw=e.target.closest('.tw');
  if(tw&&tw.textContent.trim()){const n=tw.closest('.node');n.classList.toggle('closed');tw.textContent=n.classList.contains('closed')?'▸':'▾';return}
  const row=e.target.closest('.nrow');
  if(row){const n=row.closest('.node');if(n.dataset.id)openClaim(n.dataset.id);else if(n.dataset.pillar){n.classList.toggle('closed');$('.tw',n).textContent=n.classList.contains('closed')?'▸':'▾'}return}
  const cl=e.target.closest('[data-claim]');if(cl){openClaim(cl.dataset.claim);return}
  if(!e.target.closest('#drawer'))closeDrawer();
});
function gotoPillar(id){show('argument');if(treeDepth==='pillar'){treeDepth='core';renderArgument()}const el=$('#pil-'+id);if(el){el.classList.remove('closed');el.scrollIntoView({block:'start'});window.scrollBy(0,-110)}}

// ---------- 抽屉 ----------
function posText(p){if(p==null)return'';return p<.2?'本章开头':p<.4?'本章前段':p<.6?'本章中段':p<.8?'本章后段':'本章结尾'}
function openClaim(id){
  const c=C[id];if(!c)return;
  const rel=(arr,map)=>arr.map(k=>C[k.id]?`<div class="rl" data-claim="${k.id}"><span class="mut sm">${map[k.type]||''}</span> ${kindPill(C[k.id])}${esc(C[k.id].text)} <span class="chtag">${esc(chShort(C[k.id].ch))}</span>${k.note?`<div class="sm mut">${esc(k.note)}</div>`:''}</div>`:'').join('');
  const crit=B.critique.filter(x=>(x.targets||[]).some(t=>t===id||c.pillars.includes(t)));
  const qs=B.questions.filter(x=>(x.claims||[]).includes(id));
  $('#dbody').innerHTML=`<div>${kindPill(c)}<span class="pill mut">${esc(L.weight[c.weight]||'')}</span>${c.pillars.map(p=>`<span class="pid">${p}</span>`).join('')}</div>
  <div class="big">${esc(c.text)}</div>
  ${c.kind==='counter'?'<div class="notice">这是作者引述并<b>反对</b>的观点,不是作者的主张。</div>':''}
  <h4>出处</h4><div class="sm"><span class="lk" onclick="gotoChapter('${c.ch}')">${esc(CHM[c.ch].title)}</span> · ${posText(c.pos)}</div>
  <div class="quote">定位:「${esc(c.quote)}」<div class="sm">在你的书里搜索这段文字即可找到原文。</div></div>
  ${(kids[id]||[]).length?`<h4>它的依据与展开</h4>${rel(kids[id],REL_DOWN)}`:''}
  ${(ups[id]||[]).length?`<h4>它所服务的</h4>${rel(ups[id],REL_UP)}`:''}
  ${crit.length?`<h4>审视(导读的分析)</h4>${crit.map(x=>`<div class="rl" onclick="show('critique')"><span class="pill mut">${esc(L.crit[x.type])}</span>${esc(x.text)}</div>`).join('')}`:''}
  ${qs.length?`<h4>相关自测题</h4>${qs.map(x=>`<div class="rl" onclick="show('quiz')">${esc(x.q)}</div>`).join('')}`:''}`;
  $('#drawer').classList.add('on');
}
function closeDrawer(){$('#drawer').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

  const side=D.chapters.map(c=>c.skip?`<div class="skipd" title="${esc(c.why||'')}">${esc(chShort(c.id))}<span>未纳入</span></div>`:
    `<div class="${c.id===curCh?'on':''}" onclick="gotoChapter('${c.id}')"><span>${esc(c.title)}</span></div>`).join('');
  const lv={core:['core'],support:['core','support'],all:['core','support','detail']}[chLevel];
  const cl=ch.claims.filter(c=>lv.includes(c.weight));
  const cps=B.concepts.filter(cp=>ch.concepts.includes(cp.term)||(cp.aka||[]).some(a=>ch.concepts.includes(a)));
  $('#s-chapters').innerHTML=`<div class="two"><div class="side">${side}</div><div>

  <div class="card"><div class="lead">这一章在全书里的作用</div><div style="font-weight:600">${esc(ch.role)}</div><p style="margin:8px 0 0">${esc(ch.summary)}</p>
  ${ch.why?`<p class="sm mut" style="margin:8px 0 0">读法建议:${esc(ch.why)}</p>`:''}
  ${cps.length?`<p class="sm" style="margin:8px 0 0"><span class="mut">本章概念:</span>${cps.map(cp=>`<span class="lk" onclick="gotoConcept('${esc(cp.term)}')">${esc(cp.term)}</span>`).join('、')}</p>`:''}</div>
  <div class="tools">显示 <span class="seg"><button data-l="core">只看主干</button><button data-l="support">主干+支撑</button><button data-l="all">全部</button></span><span class="hint">按书中出现顺序;共 ${ch.claims.length} 条</span></div>
  <div class="card" style="padding:8px">${cl.map(c=>`<div class="claim w-${c.weight}" data-claim="${c.id}">${kindPill(c)}${esc(c.text)} <span class="loc">${c.pillars.map(p=>`<span class="pid">${p}</span>`).join('')}</span></div>`).join('')}</div>
  ${ch.skipped.length?`<p class="sm mut">本章未做笔记的部分:${ch.skipped.map(esc).join(';')}</p>`:''}

}

// ---------- 审视 ----------
function tgt(t){if(t==='thesis')return'<span class="pid">核心论点</span>';if(P[t])return`<span class="lk" onclick="gotoPillar('${t}')"><span class="pid">${t}</span>${esc(P[t].title)}</span>`;if(C[t])return`<span class="lk" data-claim="${t}">「${esc(C[t].text.slice(0,26))}…」</span>`;return esc(t)}
function renderCritique(){
  const order=['gap','assumption','objection','scope','strength'];
  $('#s-critique').innerHTML=`<div class="notice"><b>这一页不是作者的观点。</b>它是导读(AI)对这本书论证质量的分析,帮你决定哪些结论可以直接采信、哪些需要打折扣。它本身也可能有错——请把它当作提问清单,而不是定论。</div>`+
  order.filter(t=>B.critique.some(c=>c.type===t)).map(t=>`<h2>${esc(L.crit[t])}</h2>`+B.critique.filter(c=>c.type===t).map(c=>`<div class="card"><div>${esc(c.text)}</div><div class="sm mut" style="margin-top:6px">针对:${(c.targets||[]).map(tgt).join(' ')}</div></div>`).join('')).join('')+
  `<h2>作者自己承认的限定 <small>来自原书</small></h2><div class="card" style="padding:8px">${Object.values(C).filter(c=>c.kind==='caveat').map(c=>`<div class="claim" data-claim="${c.id}">${kindPill(c)}${esc(c.text)} <span class="chtag">${esc(chShort(c.ch))}</span></div>`).join('')||'<div class="sm mut" style="padding:6px">笔记中没有记录到作者的自我限定。</div>'}</div>`;
}

// ---------- 自测 ----------
let quizOnly=false;
function renderQuiz(){
  const st=store.get('quiz',{});
  const known=B.questions.filter((q,i)=>st[i]==='y').length;
  const order=['recall','explain','apply','evaluate'];
  $('#s-quiz').innerHTML=`<p class="hint">先在心里(或纸上)答,再点开对照。能用自己的话讲出来,才算读懂了。答不出就点「依据」回到对应论证。</p>
  <div class="tools"><span class="prog">已掌握 ${known} / ${B.questions.length}</span><button class="${quizOnly?'on':''}" id="qonly">只看未掌握</button><button id="qreset">清空记录</button></div>`+
  order.filter(lv=>B.questions.some(q=>q.level===lv)).map(lv=>`<h2>${esc(L.level[lv])} <small>${{recall:'书里说了什么',explain:'为什么这么说、各部分如何相连',apply:'换个情境还会用吗',evaluate:'这个论证站得住吗'}[lv]}</small></h2>`+
    B.questions.map((q,i)=>q.level!==lv||(quizOnly&&st[i]==='y')?'':`<div class="card qa" data-q="${i}"><div><b>${esc(q.q)}</b></div><div class="try">点击查看参考答案</div>
    <div class="ans">${esc(q.a)}<div class="sm mut" style="margin-top:6px">依据:${(q.claims||[]).map(tgt).join(' ')}</div>
    <div class="rate">我答对了吗?<button class="y ${st[i]==='y'?'on':''}" data-r="y">掌握了</button><button class="n ${st[i]==='n'?'on':''}" data-r="n">还不行</button></div></div></div>`).join('')).join('');
  $('#qonly').onclick=()=>{quizOnly=!quizOnly;renderQuiz()};
  $('#qreset').onclick=()=>{store.set('quiz',{});renderQuiz()};
  $$('#s-quiz .qa').forEach(el=>el.onclick=e=>{
    const r=e.target.closest('[data-r]');
    if(r){const s=store.get('quiz',{});s[el.dataset.q]=r.dataset.r;store.set('quiz',s);renderQuiz();return}
    if(e.target.closest('.lk'))return;el.classList.toggle('open')});
}

// ---------- 搜索 ----------
function hl(s,q){const i=s.toLowerCase().indexOf(q);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
$('#search').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){show(location.hash.slice(1)||'overview');return}
  const cl=Object.values(C).filter(c=>(c.text+c.quote).toLowerCase().includes(q));
  const cp=B.concepts.filter(c=>(c.term+c.def+(c.aka||[]).join('')).toLowerCase().includes(q));
  $('#s-search').innerHTML=`<h2>概念 <small>${cp.length}</small></h2>${cp.map(c=>`<div class="card" style="cursor:pointer" onclick="gotoConcept('${esc(c.term)}')"><b>${hl(c.term,q)}</b>:${hl(c.def,q)}</div>`).join('')||'<p class="mut sm">无</p>'}
  <h2>笔记 <small>${cl.length}</small></h2><div class="card" style="padding:8px">${cl.map(c=>`<div class="claim w-${c.weight}" data-claim="${c.id}">${kindPill(c)}${hl(c.text,q)} <span class="chtag">${esc(chShort(c.ch))}</span></div>`).join('')||'<p class="mut sm">无</p>'}</div>`;
  $$('nav button').forEach(b=>b.classList.remove('on'));$$('main section').forEach(s=>s.classList.toggle('on',s.id==='s-search'));
};

// ---------- 页脚 ----------
(function(){const s=D.meta.stats,a=s.audit||{};
$('#foot').innerHTML=`<b>可靠性说明</b> · 这份导读由 AI 阅读全书后生成(${D.meta.generated})。共 ${s.claims} 条笔记、${s.concepts} 个概念,覆盖 ${s.chapters} 章;每条笔记都带原文锚点,并经程序核对"定位片段确实出现在所指段落"。`+
(a.total?`另由独立核查逐条对照原文抽查了 ${a.total} 条:${a.ok} 条通过,${a.fixed} 条发现问题后已修正${a.open?`,<b>${a.open} 条尚未解决</b>`:''}。`:'<b>未做独立核查</b>,请对内容保持更多警惕。')+
(s.warnings?`仍有 ${s.warnings} 条程序提示未处理。`:'')+
`<br>全部内容是对原书的转述与分析,不含原文段落(用于定位的短片段合计约占原书 ${s.quote_pct}%)。转述难免有损,重要的判断请回到原书核对。`})();

renderOverview();renderArgument();renderChapters();renderConcepts();renderCritique();renderQuiz();
show((location.hash.slice(1)&&TABS.some(t=>t[0]===location.hash.slice(1)))?location.hash.slice(1):'overview');
</script>
</body>

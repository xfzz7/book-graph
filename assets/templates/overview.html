<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>总览导图</title>
<style>
:root{--paper:#f4efe4;--card:#fffdf8;--ink:#27231e;--mute:#7b7266;--line:#cdc3b0;--rule:#e4dcca;--accent:#a8452a;
  --serif:"Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
header{padding:44px 56px 20px;max-width:1100px}
header .kick{font-size:12px;letter-spacing:.22em;color:var(--accent);margin-bottom:10px}
header h1{font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:.02em;margin:0 0 4px}
header .by{color:var(--mute);font-size:14px;margin-bottom:16px}
header .th{font-family:var(--serif);font-size:19px;line-height:1.7;max-width:760px;margin:0 0 20px}
.tools{display:flex;gap:8px;align-items:center}
.tools button{font:inherit;font-size:12.5px;padding:5px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.tools button:hover{background:#ebe4d3}
.tools .note{font-size:12px;color:var(--mute);margin-left:8px}
#wrap{padding:10px 56px 90px;overflow-x:auto}
/* 树 */
.tn{display:flex;align-items:center}
.kids{margin-left:52px;position:relative}
.kids::before{content:"";position:absolute;left:-52px;top:50%;width:26px;border-top:1.5px solid var(--line)}
.kid{position:relative;padding:7px 0}
.kid::before{content:"";position:absolute;left:-26px;top:50%;width:26px;border-top:1.5px solid var(--line)}
.kid::after{content:"";position:absolute;left:-26px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.kid:first-child::after{top:50%}.kid:last-child::after{bottom:50%}.kid:only-child::after{display:none}
.collapsed>.kids{display:none}
/* 卡片 */
.card{position:relative;flex:none;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 16px 14px 18px;cursor:pointer;
  box-shadow:0 1px 0 rgba(120,100,60,.08),0 6px 18px -12px rgba(90,70,30,.35);transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 1px 0 rgba(120,100,60,.1),0 10px 24px -12px rgba(90,70,30,.5)}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c,var(--accent))}
.card.sel{outline:2px solid var(--c,var(--accent));outline-offset:2px}
.card .lab{font-size:11px;letter-spacing:.16em;color:var(--c,var(--accent));margin-bottom:3px;display:flex;justify-content:space-between}
.card .ttl{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.45;margin:0 0 5px}
.card .txt{font-size:13px;line-height:1.7;color:#5c5448}
.caret{font-size:10px;color:var(--mute);letter-spacing:0}
.root.card{width:300px;--c:#27231e}
.root .ttl{font-size:21px}
.part.card{width:290px}
.chap.card{width:330px}
.pt{flex:none;width:400px;font-size:13.5px;line-height:1.65;padding:7px 12px 7px 14px;border-left:2px solid var(--c,var(--line));cursor:pointer;background:rgba(255,253,248,.55);border-radius:0 8px 8px 0}
.pt:hover{background:#fffdf8}.pt.sel{background:#fffdf8;outline:1.5px solid var(--c)}
.pt .n{color:var(--mute);font-size:11.5px;margin-left:6px}
/* 抽屉 */
#drawer{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--card);border-left:1px solid var(--rule);box-shadow:-18px 0 40px -28px rgba(60,40,10,.45);transform:translateX(102%);transition:transform .22s;overflow-y:auto;z-index:20}
#drawer.show{transform:none}
#drawer .in{padding:34px 26px 60px}
#drawer .lab{font-size:11px;letter-spacing:.16em;color:var(--accent)}
#drawer h2{font-family:var(--serif);font-size:23px;line-height:1.4;margin:6px 0 10px}
#drawer .lead{font-family:var(--serif);font-size:15.5px;line-height:1.85;color:#3a342c;margin:0 0 20px}
#drawer h3{font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:600;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--rule)}
.cl{padding:9px 0;border-bottom:1px dotted var(--rule)}
.cl .row{display:flex;gap:7px;align-items:center;margin-bottom:4px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;color:#fff;letter-spacing:.06em}
.bs{font-size:10.5px;color:var(--mute)}
.cl .t{font-family:var(--serif);font-size:14.5px;line-height:1.8}
.ch-link{display:block;padding:7px 0;font-size:13.5px;line-height:1.6;cursor:pointer;border-bottom:1px dotted var(--rule)}
.ch-link:hover{color:var(--accent)}
#x{position:absolute;top:12px;right:16px;border:0;background:none;font-size:24px;color:var(--mute);cursor:pointer}
@media(max-width:900px){header{padding:28px 22px 14px}#wrap{padding:10px 22px 70px}#drawer{width:100%}}
</style>
</head>
<body>
<header>
  <div class="kick">总览导图 · OVERVIEW</div>
  <h1 id="t"></h1>
  <div class="by" id="by"></div>
  <p class="th" id="th"></p>
  <div class="tools"><button id="b1">展开全部要点</button><button id="b2">只看到章</button><span class="note">点击任一卡片,右侧查看这一部分的详细命题</span></div>
</header>
<div id="wrap"><div id="tree"></div></div>
<aside id="drawer"><button id="x">×</button><div class="in" id="din"></div></aside>

<script>
const PK=/*DATA*/null/*END*/;const D=PK.D;
const TYC={V:'#a8452a',M:'#3c5a6b',F:'#5f7a4f',E:'#a9762b'};
const BS={e:'书中明确',x:'案例 / 个人经历',i:'推断'};
const byId=Object.fromEntries(D.claims.map(c=>[c.id,c]));
document.title=D.title+' · 总览导图';
document.getElementById('t').textContent=D.title;
document.getElementById('by').textContent=D.subtitle+' · '+D.author;
document.getElementById('th').textContent=D.thesis;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
let selEl=null;
function node(card,kids,open){
  const n=el('div','tn'+(kids&&kids.length&&!open?' collapsed':''));
  n.appendChild(card);
  if(kids&&kids.length){
    const k=el('div','kids');kids.forEach(c=>{const w=el('div','kid');w.appendChild(c);k.appendChild(w)});n.appendChild(k);
    card.dataset.hasKids=1;
  }
  return n;
}
function mkCard(cls,lab,title,txt,color,caret){
  const c=el('div','card '+cls);c.style.setProperty('--c',color);
  c.innerHTML=`<div class="lab"><span>${esc(lab)}</span><span class="caret">${caret?'▾':''}</span></div><div class="ttl">${esc(title)}</div>${txt?`<div class="txt">${esc(txt)}</div>`:''}`;
  return c;
}
function select(card,fn){
  if(selEl)selEl.classList.remove('sel');selEl=card;card.classList.add('sel');fn();
}
function claimHtml(ids){
  return ids.map(i=>{const c=byId[i];return `<div class="cl"><div class="row"><span class="tag" style="background:${TYC[c.ty]}">${D.claimTypes[c.ty]}</span><span class="bs">${BS[c.basis]}</span></div><div class="t">${esc(c.t)}</div></div>`}).join('');
}
function open_(html){document.getElementById('din').innerHTML=html;document.getElementById('drawer').classList.add('show')}
function toggle(card,wrapper){
  if(card.dataset.hasKids){wrapper.classList.toggle('collapsed');const cr=card.querySelector('.caret');if(cr)cr.textContent=wrapper.classList.contains('collapsed')?'▸':'▾'}
}
// 构建
const chapNodes=[];
const partNodes=D.outline.map(p=>{
  const pc=p.color;
  const cNodes=p.chapters.map(ch=>{
    const pts=ch.points.map(pt=>{
      const d=el('div','pt');d.style.setProperty('--c',pc);d.innerHTML=esc(pt.text)+`<span class="n">${pt.claims.length}</span>`;
      d.onclick=e=>{e.stopPropagation();select(d,()=>open_(`<div class="lab">${esc(ch.title)}</div><h2>${esc(pt.text)}</h2><h3>相关命题(${pt.claims.length})</h3>${claimHtml(pt.claims)}`))};
      return d;
    });
    const nm=ch.title.split(' ');
    const cc=mkCard('chap',nm[0],nm.slice(1).join(' ')||nm[0],ch.takeaway,pc,pts.length>0);
    const w=node(cc,pts,false);
    const all=ch.points.flatMap(p=>p.claims);
    cc.onclick=()=>{select(cc,()=>open_(`<div class="lab">${esc(nm[0])}</div><h2>${esc(nm.slice(1).join(' ')||nm[0])}</h2><p class="lead">${esc(ch.takeaway)}</p><h3>要点(${ch.points.length})</h3>${ch.points.map(p=>`<div class="ch-link">${esc(p.text)}</div>`).join('')}<h3>本章命题(${all.length})</h3>${claimHtml(all)}`));toggle(cc,w)};
    chapNodes.push(w);return w;
  });
  const pcard=mkCard('part',p.label,p.sub||p.label,p.thesis,pc,cNodes.length>0);
  const pw=node(pcard,cNodes,true);
  pcard.onclick=()=>{select(pcard,()=>open_(`<div class="lab">${esc(p.label)}</div><h2>${esc(p.sub||p.label)}</h2><p class="lead">${esc(p.thesis)}</p><h3>包含的章</h3>${p.chapters.map(c=>`<div class="ch-link">${esc(c.title)}<div style="color:#7b7266;font-size:12.5px;margin-top:2px">${esc(c.takeaway)}</div></div>`).join('')}`));toggle(pcard,pw)};
  return pw;
});
const rc=mkCard('root','全书主旨',D.title,D.thesis,'#27231e',true);
const rw=node(rc,partNodes,true);
rc.onclick=()=>{select(rc,()=>open_(`<div class="lab">全书主旨</div><h2>${esc(D.title)}</h2><p class="lead">${esc(D.thesis)}</p><h3>全书结构</h3>${D.outline.map(p=>`<div class="ch-link"><b>${esc(p.label)}${p.sub?' · '+esc(p.sub):''}</b><div style="color:#7b7266;font-size:12.5px;margin-top:2px">${esc(p.thesis)}</div></div>`).join('')}`));toggle(rc,rw)};
document.getElementById('tree').appendChild(rw);
function setAll(open){
  chapNodes.forEach(w=>{w.classList.toggle('collapsed',!open);const c=w.querySelector('.card .caret');if(c)c.textContent=open?'▾':'▸'});
}
// 初始:章级折叠(显示 ▸)
chapNodes.forEach(w=>{const c=w.querySelector('.card .caret');if(c)c.textContent='▸'});
requestAnimationFrame(()=>{const r=rc.getBoundingClientRect();window.scrollTo(0,Math.max(0,r.top+scrollY-260))});
document.getElementById('b1').onclick=()=>setAll(true);
document.getElementById('b2').onclick=()=>setAll(false);
document.getElementById('x').onclick=()=>{document.getElementById('drawer').classList.remove('show');if(selEl){selEl.classList.remove('sel');selEl=null}};
</script>
</body>
</html>
